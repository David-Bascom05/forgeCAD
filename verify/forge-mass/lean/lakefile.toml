name = "forgemass"
version = "0.1.0"
defaultTargets = ["ForgeMass"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib for ℝ, trigonometry and integrals, at the tag matching the toolchain (the pin
# verify/ieee754 uses).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "ForgeMass"
