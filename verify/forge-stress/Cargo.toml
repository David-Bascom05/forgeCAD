[package]
name = "forge-stress"
description = "The kernel under real machine models: import, check, mass, mesh, section and booleans on every solid of a STEP file, each op watched (tools/kernel-stress/run.sh)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
forge-math = { path = "../../kernel/forge-math" }
forge-geom = { path = "../../kernel/forge-geom" }
forge-topo = { path = "../../kernel/forge-topo" }
forge-ops = { path = "../../kernel/forge-ops" }
forge-mesh = { path = "../../kernel/forge-mesh" }
forge-bool = { path = "../../kernel/forge-bool" }
forge-step = { path = "../../kernel/forge-step" }
forge-asm = { path = "../../kernel/forge-asm" }
forge-agent = { path = "../../interface/forge-agent" }

[features]
# forge-bool's decision log: with FORGE_DECISIONS_SITES set, each hit of a named decisions site is
# written on stderr, and run.sh (KS_DECISIONS=1) keeps it as a `site` event under the op in flight
decisions = ["forge-bool/decisions"]

[lints]
workspace = true
