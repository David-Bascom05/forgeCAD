name = "sheet"
version = "0.1.0"
defaultTargets = ["Sheet"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib at the tag the toolchain matches: the pin verify/ieee754 and verify/krawczyk use.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "Sheet"

# The differential oracle of interface/forge-lang/tests/sheet_lean_diff.rs and
# kernel/forge-sheet/tests/lean_diff_region.rs.
[[lean_exe]]
name = "sheet-oracle"
root = "OracleMain"

# The IEEE 754 model (verify/ieee754, the same toolchain and Mathlib pin): the float filter of
# Sheet/Float.lean is proven against it.
[[require]]
name = "ieee754"
path = "../ieee754"
