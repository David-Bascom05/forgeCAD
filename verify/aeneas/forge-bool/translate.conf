# kernel/forge-bool: today's boolean, translated for boolean_correct (verify/forge-bool-proof)
PKG=ForgeBool
DEPS=(forge-math forge-geom)
# D2, the surface-surface meet (ssi.rs)
CHARON_ARGS=(
  --start-from forge_bool::ssi::surfaces_in
  --start-from forge_bool::ssi::closed_or_flush
)
# The opaque markers (research/aeneas/SURVEY.md, "The dyn question"): the procedural wrappers and
# the shared intersection curve are opaque values, so Curve, Surface, Edge, Face and Body
# translate. Each is an open L4 gap (verify/forge-bool-proof/LEDGER.md, "L4 gaps").
CHARON_ARGS+=(
  --opaque forge_geom::curve::ProcCurve
  --opaque forge_geom::surface::Proc
  --opaque forge_geom::intcurve::IntCurve
)
# G9 (FALLBACK's): the searched-pairs cache, a thread-local map in front of the curved search.
# An open L4 gap until the cache goes.
CHARON_ARGS+=(
  --opaque forge_bool::ssi::searched
)
# The dependencies' types, whole (their fields are read here); their functions are the
# dependencies' own translations (DEPS)
CHARON_ARGS+=(
  --include forge_math::vec::Vec2 --include forge_math::vec::Point2
  --include forge_math::vec::Vec3 --include forge_math::vec::Point3 --include forge_math::vec::UnitVec3
  --include forge_math::frame::Frame
  --include forge_math::interval::Interval --include forge_math::interval::Box3
  --include forge_math::interval::Box2
  --include forge_geom::curve::Curve --include forge_geom::curve::Line
  --include forge_geom::curve::Circle --include forge_geom::curve::Ellipse
  --include forge_geom::curve::Parabola --include forge_geom::curve::Hyperbola
  --include forge_geom::surface::Surface --include forge_geom::surface::Plane
  --include forge_geom::surface::Cylinder --include forge_geom::surface::Cone
  --include forge_geom::surface::Sphere --include forge_geom::surface::Torus
  --include forge_geom::intersect::SurfaceSurface --include forge_geom::intersect::Contact
)
