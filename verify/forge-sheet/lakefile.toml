name = "forgesheet"
version = "0.1.0"
defaultTargets = ["ForgeSheet"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The fold of a bend zone and its proofs (research/kernel-audit/audit2.md §2.0): Mathlib's real
