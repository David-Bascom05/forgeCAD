link = "Z"
kind = "milling"
axis = [0, 0, 1]
nose = [0, 0, 660]
rpm = [50, 15000]
max = [1000, 500]
interface = "NST No.40 (dual contact per US page)"

[[machine.changer]]
pockets = 30
change_s = 4.2   # chip to chip, published (tool to tool 2.2)
max_tool_kg = 7

[[machine.mount]]
