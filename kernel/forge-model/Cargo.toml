[package]
name = "forge-model"
description = "Feature history and regeneration for ForgeCAD parts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-math = { path = "../forge-math" }
forge-geom = { path = "../forge-geom" }
forge-topo = { path = "../forge-topo" }
forge-ops = { path = "../forge-ops" }
forge-bool = { path = "../forge-bool" }
forge-gpu = { path = "../forge-gpu" }
forge-sketch = { path = "../forge-sketch" }
forge-font = { path = "../forge-font" }

[features]
# the boolean's decision log (forge-bool's `decisions`), with the n-ary regen's fallbacks to the
# sequential one counted as rungs of its retry ladder
decisions = ["forge-bool/decisions"]
# certified surface-surface tracing (forge-geom's `certified_trace`)
certified_trace = ["forge-bool/certified_trace"]
# the decide-once flat-face boolean (forge-bool's `decide_once`): off in every shipped build.
# `cargo test -p forge-model --test hidden_inputs --features decide_once` reviews its sources too
decide_once = ["forge-bool/decide_once"]
# the local-imprint column path selectable at run time (forge-bool's `imprint_column`): off in every
# shipped build; `cargo test -p forge-model --test imprint --features imprint_column` checks it
imprint_column = ["forge-bool/imprint_column"]

[dev-dependencies]
# nary_threads forces helper threads on (par::force_helpers)
forge-math = { path = "../forge-math", features = ["force_helpers"] }
forge-dirs = { path = "../forge-dirs" }
forge-lang = { path = "../../interface/forge-lang" }
forge-mesh = { path = "../forge-mesh" }

# its test: every feature kind reaches the oracle
[[example]]
name = "oracle"
test = true

[lints]
workspace = true
