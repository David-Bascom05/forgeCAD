[package]
name = "forge-geom"
description = "Exact curves, surfaces and their intersections for the ForgeCAD kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-math = { path = "../forge-math" }

[features]
# the boolean's decision log (forge-bool's `decisions`): the hair-root choice recorded where a
# collector asks (`intersect::hair_log`)
decisions = []
# certified surface-surface tracing (src/certify.rs, research/kernel-audit/certified-tracing.md):
# every analytic pair's march checked by interval Krawczyk steps and exclusion, re-traced finer
# once, else refused; off, nothing is compiled
certified_trace = []

[lints]
workspace = true

[[example]]
name = "certify_sweep"
required-features = ["certified_trace"]
