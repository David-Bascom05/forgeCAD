# kernel/forge-bool, boolean.rs's keep and apply steps (D7's and D8's code halves), translated for
# verify/forge-bool-proof. A second translation of forge-bool, in its own package: TRANSLATE's
# verify/aeneas/forge-bool (ssi.rs, D2) is the first; the two can merge into one package later.
SRC_CRATE=forge-bool
PKG=ForgeBoolApply
BRIDGE=none
CHARON_ARGS=(
  --start-from forge_bool::boolean::keep_of
)
# `apply` (D8.writes/sense/lone) does not translate yet. With TRANSLATE's opaques
# (forge_geom::curve::ProcCurve, forge_geom::surface::Proc, forge_geom::intcurve::IntCurve) and
# classify::drop_query_loops/extend_query opaque, Aeneas still stops at:
# - forge_topo::body::Face::query, `Cached<Arc<dyn Any + Send + Sync>>`: dynamic trait types;
# - iterator adapters with closures in apply (zip/filter/map/collect, copied, any/all, find,
#   rev, filter+fold in grown_tol): no models, and slice::Iter::find's lifetime constraint;
# - the FnMut closure `vertex` (with get_or_insert_with) and `renamed`.
# Reported to the master with the smallest Rust changes; no Rust is changed for the prover.
