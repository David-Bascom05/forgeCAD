# The fallback's proofs (verify/forge-bool-fallback): the FALLBACK rows of the shipped boolean's
# ledger (verify/forge-bool-proof/LEDGER.md), core Lean only.
#   1. `lake build`, which fails on any broken lemma;
#   2. the axiom report (Axioms.lean): every theorem listed shows only propext, Classical.choice
#      and Quot.sound, never sorryAx.
# Lake's build directory is restored from main's latest (Lake rebuilds every module whose sources
# differ); main's runs save it (tools/ci/lake-cache.py).
name: forge-bool-fallback

on:
  push:
    branches: [main]
    paths:
      - "verify/forge-bool-fallback/**"
      - ".github/workflows/forge-bool-fallback.yml"
  pull_request:
    paths:
      - "verify/forge-bool-fallback/**"
      - ".github/workflows/forge-bool-fallback.yml"
  workflow_dispatch:

# A new push to a pull request cancels that pull request's runs still queued or running for its
# older commits; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: elan and the pinned Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat verify/forge-bool-fallback/lean-toolchain)"

      - name: Lake cache key
        id: lake
        run: python3 tools/ci/lake-cache.py forge-bool-fallback verify/forge-bool-fallback
      - name: Lake build (restored; Lake rebuilds what changed)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.lake.outputs.paths }}
          key: ${{ steps.lake.outputs.key }}
          restore-keys: |
            ${{ steps.lake.outputs.prefix }}
            ${{ steps.lake.outputs.any }}

      - name: the proofs
        if: ${{ github.event_name != 'push' || steps.restore.outputs.cache-hit != 'true' }}
        working-directory: verify/forge-bool-fallback
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if [ "$GITHUB_EVENT_NAME" = push ]; then exit 0; fi  # main: the build above is what is saved; the checks below ran on the pull request
          grep -q "Build completed successfully" build.log
          if grep -q "declaration uses [\`']sorry" build.log; then echo "::error::sorry"; exit 1; fi

      - name: the axiom report
        if: ${{ github.event_name != 'push' }}
        working-directory: verify/forge-bool-fallback
        run: |
          set -o pipefail
          lake env lean Axioms.lean | tee axioms.txt
          n=$(grep -c -E "depends on axioms|does not depend on any axioms" axioms.txt)
          [ "$n" -eq "$(grep -c '^#print axioms' Axioms.lean)" ] || { echo "::error::axiom report incomplete"; exit 1; }
          bad=$(grep "depends on axioms" axioms.txt | grep -v -E "\[(propext)?(, )?(Classical\.choice)?(, )?(Quot\.sound)?\]" || true)
          if [ -n "$bad" ]; then echo "::error::non-standard axioms:"; echo "$bad"; exit 1; fi
          if grep -q "sorryAx" axioms.txt; then echo "::error::sorry"; exit 1; fi

      - name: save the Lake build (main only, even when a check failed)
        if: ${{ always() && steps.lake.outcome == 'success' && steps.restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.lake.outputs.paths }}
          key: ${{ steps.lake.outputs.key }}
