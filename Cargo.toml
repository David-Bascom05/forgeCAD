[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.commonty.org/david/ForgeCAD"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_cmp = "allow"
many_single_char_names = "allow"

[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# the browser build: cargo build --profile wasm --target wasm32-wasip1
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
