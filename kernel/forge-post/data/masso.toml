# MASSO G3 (mill): restated from MASSO's documentation (docs.masso.com.au, updated 5 Oct 2026);
# every code is cited below. MASSO skips a whole line containing a code it does not support, so only
# listed codes are written: no G43/G49 (length offsets are applied at the tool change), no G84/G85.
[dialect]
name = "masso"
extension = "nc"
decimals = 4
feed_decimals = 1
units_mm = "G21"
units_inch = "G20"
inch_decimals = 4
inch_feed_decimals = 2
point = "always"
program_open = ["({title})"]
program_close = ["M30"]
comment = "({text})"
comment_strip = "()"
line_numbers = false
safe_start = ["G17 {units} G40 G80 G90 G94"]
tool_change = ["T{t} M06"]
spindle_cw = "S{rpm} M03"
spindle_ccw = "S{rpm} M04"
spindle_stop = "M05"
wcs = "G{n}"
wcs_first = 54
wcs_count = 6
arc = "ijk"
retract_home = ["G53 G00 Z0"]
coolant_flood = "M08"
coolant_mist = "M07"
coolant_off = "M09"
dwell = "G04 P{ms}"
cycle_drill = "G98 G81 X{x} Y{y} Z{z} R{r} F{f}"
cycle_dwell = "G98 G82 X{x} Y{y} Z{z} R{r} P{ms} F{f}"
cycle_peck = "expand"
cycle_chipbreak = "expand"
cycle_tap = "refuse"
cycle_ream = "expand"
cycle_next = "X{x} Y{y}"
cycle_cancel = "G80"
source = "MASSO documentation, docs.masso.com.au (cited per code)"
taken = "2026-11-23"
note = "the program must stop the spindle (M05) before M06; T before M06 on the line"
cite_required = true

