# The app in a browser (docs/web.md): built for wasm32, then in Chromium with a software WebGPU
# adapter, end to end on `forgecad web`'s files and every bench part and example against the
# native build, bit for bit. The Forgejo CI runs the same steps in one job
# (interface/forge-render/web/tests/ci.sh, its `web` job); here they are split to run at once:
#   cli      the native `forgecad` (serves the page)        root workspace, release
#   parity   the native reference, forge-parity             forge-render's workspace, release
#   wasm     the page: wasm32 release build + wasm-bindgen  forge-render's workspace; the
#            default build and the threaded artifact (THREADS=only) at once, put together after
#   clippy   the wasm32 build stays warning-free
#   gpu      forge-render's own tests (cargo test) on lavapipe, a software Vulkan GPU, so the
#            renderer's and the Render Studio's GPU tests run instead of skipping
#   browser  for the default build and for the threaded artifact (THREADED=1, which adds
#            responsive.cjs): e2e on one runner, and parity on every bench part and example in
#            three shards that between them test each file once (PARITY_SHARD in parity.cjs)
# The commands, crates, profiles and flags are ci.sh's. Each Rust job has its own build cache,
# saved only from main (and manual runs), so a pull request restores main's and never races it.
#
# A push to main only refreshes those caches: pull requests merge with current main in their head,
# so every check below already ran on the tree that lands. On push, parity, wasm and clippy restore
# their cache and, when it was not an exact hit, build with the same commands and save; cli (whose
# cache holds no third-party crates), the uploads, browser and the summary do not run. A manual run
# (workflow_dispatch) runs everything.
name: web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that pull request's runs still queued or running for its
# older commits; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0

jobs:
  cli:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: cargo build --release --locked -p forge-cli
      - uses: actions/upload-artifact@v4
        with:
          name: forgecad
          path: target/release/forgecad
          retention-days: 1

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: interface/forge-render
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        id: rust
        with:
          workspaces: interface/forge-render -> target
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: cargo build --release --locked --bin forge-parity
        if: ${{ github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true' }}
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'push' }}
        with:
          name: forge-parity
          path: interface/forge-render/target/release/forge-parity
          retention-days: 1

  wasm:
    strategy:
      fail-fast: false
      matrix:
        threads: ["", only]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: interface/forge-render
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: rustup show && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        id: rust
        with:
          workspaces: interface/forge-render -> target
          key: threads-${{ matrix.threads }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      # the release binary of the version Cargo.toml pins, not a 1.5 min `cargo install`
      - uses: taiki-e/install-action@v2
        if: ${{ github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true' }}
        with:
          tool: wasm-bindgen@0.2.130
      - run: wasm-bindgen --version | grep -x 'wasm-bindgen 0.2.130'
        if: ${{ github.event_name != 'push' }}
      - run: NO_MESHES=1 THREADS=${{ matrix.threads }} sh web/build.sh "$GITHUB_WORKSPACE/target/web"
        if: ${{ github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true' }}
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'push' }}
        with:
          name: web${{ matrix.threads && '-threads' || '' }}
          path: target/web${{ matrix.threads && '/threads' || '' }}
          retention-days: 1

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: interface/forge-render
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: rustup show && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        id: rust
        with:
          workspaces: interface/forge-render -> target
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      # the browser build stays warning-free (it broke unseen before: a native-only dependency)
      # on push the same build without the lint gate (-D warnings): the cache is the same
      - run: cargo clippy --lib --locked --target wasm32-unknown-unknown -- ${{ github.event_name != 'push' && '-D warnings' || '' }}
        if: ${{ github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true' }}

  gpu:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: interface/forge-render
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: rustup show
      # lavapipe: wgpu finds it as a Vulkan adapter, no GPU needed
      - name: software Vulkan
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: interface/forge-render -> target
          key: gpu-tests
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: cargo test --release --locked --no-fail-fast
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 0

  browser:
    needs: [cli, parity, wasm]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # the default build, and the threaded artifact (docs/web.md)
        threaded: ["", "1"]
        # e2e (and, threaded, responsive.cjs) on one runner; parity's three shards on three
        test: [e2e, 0, 1, 2]
    name: browser${{ matrix.threaded && ' (threaded)' || '' }} ${{ matrix.test }}
    env:
      THREADED: ${{ matrix.threaded }}
      FORGECAD: ${{ github.workspace }}/bin/forgecad
      FORGE_PARITY: ${{ github.workspace }}/bin/forge-parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-${{ runner.os }}
      - name: playwright
        run: |
          mkdir -p "$HOME/pw" && cd "$HOME/pw"
          npm init -y >/dev/null && npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$HOME/pw/node_modules" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: forgecad
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: forge-parity
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: target/web
      - uses: actions/download-artifact@v4
        if: matrix.threaded
        with:
          name: web-threads
          path: target/web/threads
      - run: chmod +x bin/forgecad bin/forge-parity
      - name: end to end
        if: matrix.test == 'e2e'
        working-directory: interface/forge-render
        run: |
          node web/tests/e2e.cjs "$GITHUB_WORKSPACE/target/web"
          node web/tests/idle.cjs "$GITHUB_WORKSPACE/target/web"
      # the Render Studio's tracer on WebGPU against the native golden picture
      - name: render studio
        if: matrix.test == 'e2e' && !matrix.threaded
        working-directory: interface/forge-render
        run: node web/tests/studio.cjs "$GITHUB_WORKSPACE/target/web"
      - name: parity (shard ${{ matrix.test }} of 3)
        if: matrix.test != 'e2e'
        working-directory: interface/forge-render
        env:
          PARITY_SHARD: ${{ matrix.test }}/3
        run: node web/tests/parity.cjs "$GITHUB_WORKSPACE/target/web"
      # the threaded artifact: the page never blocks for a build
      - name: responsive
        if: matrix.threaded && matrix.test == 'e2e'
        working-directory: interface/forge-render
        run: node web/tests/responsive.cjs "$GITHUB_WORKSPACE/target/web"

  # the one check a pull request waits on, as before the split: every job above passed
  web:
    name: web
    needs: [cli, parity, wasm, clippy, gpu, browser]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}' = false
