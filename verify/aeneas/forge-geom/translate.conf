# kernel/forge-geom: what forge-bool's translation calls (verify/aeneas/forge-bool), and the
# spline's numerics (research/spline-spec)
PKG=ForgeGeom
DEPS=(forge-math)
CHARON_ARGS=(
  --start-from forge_geom::intersect::plane_surface
  --start-from forge_geom::intersect::planes_coincident
  --start-from forge_geom::sheet::spindle_in
)
# the spline's numerics (research/spline-spec; L4 of research/PROOF-STANDARD.md): Refine.lean,
# Thomas.lean and Insert.lean prove them
CHARON_ARGS+=(
  --start-from forge_geom::spline::lerp
  --start-from forge_geom::spline::tridiagonal
  --start-from forge_geom::spline::decasteljau
  --start-from forge_geom::spline::insert_knot
)
# The opaque markers (research/aeneas/SURVEY.md, "The dyn question"): the procedural wrappers and
# the shared intersection curve are opaque values, so Curve and Surface translate. Each is an open
# L4 gap, listed in verify/forge-bool-proof/LEDGER.md.
CHARON_ARGS+=(
  --opaque forge_geom::curve::ProcCurve
  --opaque forge_geom::surface::Proc
  --opaque forge_geom::intcurve::IntCurve
)
# Curved, open L4 gaps (not on the flat route): Aeneas stops in plane_cylinder ("Unreachable", a
# join of its branches)
CHARON_ARGS+=(
  --opaque forge_geom::intersect::plane_cylinder
)
# forge-math's types, whole (their fields are read here); their functions stay forge-math's
CHARON_ARGS+=(
  --include forge_math::vec::Vec2 --include forge_math::vec::Point2
  --include forge_math::vec::Vec3 --include forge_math::vec::Point3 --include forge_math::vec::UnitVec3
  --include forge_math::frame::Frame
  --include forge_math::interval::Interval --include forge_math::interval::Box3
  --include forge_math::interval::Box2
)
