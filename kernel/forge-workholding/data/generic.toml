# Generic milling workholding: our own round numbers for common classes of device, not any
# maker's model. Sizes vary by maker: verify with the vendor before ordering, and measure the
# device on the table before trusting a clearance. Every record here is `generic = true`, its
# `source` covering every value. Units mm (kPa for vacuum).

[[workholding]]
name = "generic-vise-150"
kind = "vise"
generic = true
source = "forgecad generic (2026-11-23): a 150 mm class machine vise; verify with the vendor"
jaw_width = 150
jaw_height = 50
jaw_thickness = 20
max_opening = 160
body_length = 400
body_width = 150
height = 100
[[workholding.part]]
body = "base"
file = "generic-vise-150/base.fg"
[[workholding.part]]
body = "fixed jaw"
file = "generic-vise-150/jaw.fg"
[[workholding.part]]
body = "moving jaw"
file = "generic-vise-150/jaw.fg"

