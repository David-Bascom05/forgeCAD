# Mach3 Mill: restated from "Using Mach3Mill" Rev 1.84-A2 (machsupport.com); every code is cited
# below. Mach3 is configured per machine: coolant outputs and the dwell unit are settings, so those
# are refused rather than guessed.
[dialect]
name = "mach3"
extension = "tap"
decimals = 4
feed_decimals = 1
units_mm = "G21"
units_inch = "G20"
inch_decimals = 4
inch_feed_decimals = 2
point = "always"
program_open = ["({title})"]
program_close = ["M30"]
comment = "({text})"
comment_strip = "()"
line_numbers = false
safe_start = ["G17 {units} G40 G49 G80 G90 G94", "G91.1"]
tool_change = ["T{t} M6"]
length_comp = "G43 H{h}"
spindle_cw = "S{rpm} M3"
spindle_ccw = "S{rpm} M4"
spindle_stop = "M5"
wcs = "G{n}"
wcs_first = 54
wcs_count = 6
arc = "ijk"
retract_home = ["G91 G28 Z0.", "G90"]
coolant_off = "M9"
cycle_drill = "G98 G81 X{x} Y{y} Z{z} R{r} F{f}"
cycle_dwell = "expand"
cycle_peck = "expand"
cycle_chipbreak = "expand"
cycle_tap = "G98 G84 X{x} Y{y} Z{z} R{r} F{f}"
cycle_ream = "G98 G85 X{x} Y{y} Z{z} R{r} F{f}"
cycle_next = "X{x} Y{y}"
cycle_cancel = "G80"
read_g_ignore = [91.1]
source = "Using Mach3Mill Rev 1.84-A2 (cited per code)"
taken = "2026-11-23"
note = "G91.1 states the incremental arc-centre mode (a configuration otherwise); flood/mist coolant and dwell are refused (machine-configured). ASSUMPTION in forge-machine only: a G4 in a mach3 program (never posted by us) is interpreted as Fanuc G4 P milliseconds; the real unit is a Config>Logic setting"
cite_required = true

[[dialect.cite]]
key = "program_open"
source = "https://www.machsupport.com/ftp/Docs/Mach3Mill_1.84.pdf"
taken = "2026-11-23"
where = "Using Mach3Mill (Artsoft; chapter 10 'G and M-code reference'), Rev 1.84-A2 (PDF dated 2006-04); 10.5.5 Comments and Messages p10-12; 10.5.2 Subroutine labels p10-10"
note = "no start code; a comment names the program"

