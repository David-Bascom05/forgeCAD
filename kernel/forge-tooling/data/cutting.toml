# Cutting data per ISO 513 group: our own round mid-range numbers for general carbide and HSS
# end milling, restated from the public ranges tool makers' handbooks give. A starting point:
# verify with the tool maker for the tool and the material.

[[group]]
group = "P"
name = "steels"
vc_carbide = 180
vc_hss = 30
fz_d1 = 0.008
fz_d20 = 0.08
kc1_1 = 1700
mc = 0.25
source = "forgecad generic mid-range, restated from public handbook ranges"
note = "verify with the tool maker"

