# ForgeCAD appearances: how a surface looks in the Render Studio (physically based, metal/rough).
# Engineering values (density, strength) live in forge-material; this file says how they render,
# and which materials and families each appearance is the default for.
#
# Keys:
#   name          what a user picks                 family   metal | plastic | glass | rubber | wood | paint | other
#   base          linear sRGB [r, g, b]: a metal's F0 (normal reflectance), else its albedo
#   metal         1 for a conductor, 0 otherwise
#   tint          a metal's specular colour: its reflectance at 82 degrees over Schlick's there
#                 (the F82-tint model, Hoffman 2023; OpenPBR's specular_color)
#   rough         perceptual roughness 0..1 (GGX alpha is its square)
#   ior           a dielectric's refractive index (plastic, glass, coats are 1.5)
#   transmission  1 for clear glass or plastic
#   coat, coat_rough  a clear coat over it (paint, anodising)
#   part_colour   true: a part's own colour (forge-material's `colour`) replaces `base`
#   materials     forge-material names this is the default appearance for
#   families      forge-material families this is the default for, when no name matches
#   source        covers every value; source_<key> overrides one; kind_<key> = cited | user | stand-in
#   note
#
# Measured sources:
#   [PB] Physically Based, the CC0 database of physically based values, A. Palmqvist et al.,
#        https://physicallybased.info (API https://api.physicallybased.info/materials, read
#        2026-11-24); metals' F0 and F82 tint computed there from measured complex IORs on
#        refractiveindex.info (each record names its data set).
# Roughness has no published mapping from a finish's Ra to GGX: every roughness here is a
# stand-in, judged against photographs, until we measure (research/render/studio.md).

