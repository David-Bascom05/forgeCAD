# Fabworks, restated from its public design guidelines (read 2026-11-22). Not an official profile
# and not endorsed by Fabworks. Verify with the vendor before ordering.
# Sources and choices: research/sheet-metal/vendors/fabworks.md
format = 1
id = "fabworks"
name = "Fabworks"
source = "https://www.fabworks.com/resources/guidelines/bending ; https://www.fabworks.com/resources/guidelines/laser-cutting/sheet ; https://www.fabworks.com/resources/materials/sheet/aluminum ; /steel ; /stainless-steel"
taken = "2026-11-22"
units = "in"
note = "Restated from Fabworks' public pages: inside radius, K and minimum flange from its measured 90 degree test bends, the distortion zone as hole to bend, the minimum feature size per stock. Not official. Verify with the vendor before ordering."
operations = ["laser", "bend", "tap", "countersink", "hardware", "powder_coat", "deburr"]

[limits]
max_flat = [47, 117]
min_flat = [0.25, 0.25]
max_bend_length = 117

[tolerance]
cut = "+/-0.005 in across the part (+/-0.002 in typical)"
bend = "+/-0.015 in per bend, +/-1 deg, plus +/-0.015 in for each further bend between"

[rules]
min_web = "1t"               # a rule of thumb on its web-width page
hole_to_edge = "1t"
bend_from = "centre"         # the distortion zone runs out from the bend line, each side
relief = { shape = "rect", width = "max(1t, 0.030)", depth = "t + r" }

