# The G-code interpreter's spec (verify/forge-machine): kernel/forge-machine/src/gcode.rs modelled
# over parsed words, its cycle and modal facts, and its refinement of forge-cam's post model, which
# with forge-cam's G6 round trip gives `posted_program`. Lean v4.36.0 with Mathlib v4.36.0, shared
# with verify/forge-cam (packagesDir). A `sorry`, `native_decide`, an `axiom`, or any axiom past
# propext, Classical.choice and Quot.sound fails the job. The `core` job does the same for the
# shipped interpreter's refinement (verify/aeneas/forge-machine-core, L4); aeneas.yml checks its
# translation is fresh.
name: forge-machine

on:
  push:
    branches: [main]
    paths: ["verify/forge-machine/**", "verify/forge-cam/ForgeCam/Post.lean", "verify/aeneas/forge-machine-core/**",
      "kernel/forge-machine-core/**", ".github/workflows/forge-machine.yml"]
  pull_request:
    paths: ["verify/forge-machine/**", "verify/forge-cam/ForgeCam/Post.lean", "verify/aeneas/forge-machine-core/**",
      "kernel/forge-machine-core/**", ".github/workflows/forge-machine.yml"]
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: verify/forge-machine
    steps:
      - uses: actions/checkout@v4
      - name: toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('verify/forge-cam/lean-toolchain') }}
      - name: Mathlib cache
        uses: actions/cache@v4
        with:
          path: verify/forge-cam/.lake/packages
          key: lake-mathlib-${{ runner.os }}-${{ hashFiles('verify/forge-cam/lakefile.toml', 'verify/forge-cam/lake-manifest.json') }}
      - name: elan, the toolchain, Mathlib's build (in forge-cam, whose packages are shared)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          (cd ../forge-cam && "$HOME/.elan/bin/lake" exe cache get)
      - name: the proofs
        run: |
          ! grep -rnE "\bsorry\b|native_decide|^\s*axiom\b" --include=*.lean ForgeMachine ForgeMachine.lean
          lake build
      - name: the axioms
        run: |
          lake env lean Axioms.lean | tee axioms.txt
          ! grep -E "sorryAx|ofReduceBool" axioms.txt
          test "$(grep -c 'depends on axioms' axioms.txt)" -eq "$(grep -c '^#print axioms' Axioms.lean)"
          ! grep 'depends on axioms' axioms.txt | grep -vE '\[(propext|Classical.choice|Quot.sound)(, (propext|Classical.choice|Quot.sound))*\]$'

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: verify/aeneas/forge-machine-core/lean
    steps:
      - uses: actions/checkout@v4
      - name: toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('verify/forge-cam/lean-toolchain') }}
      - name: Mathlib and Aeneas cache
        uses: actions/cache@v4
        with:
          path: verify/forge-cam/.lake/packages
          key: lake-mathlib-aeneas-${{ runner.os }}-${{ hashFiles('verify/forge-cam/lake-manifest.json', 'verify/aeneas/forge-machine-core/lean/lake-manifest.json') }}
      - name: elan, the toolchain, Mathlib's build (in forge-cam, whose packages are shared)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          (cd ../../../forge-cam && "$HOME/.elan/bin/lake" exe cache get)
      - name: the proofs
        run: |
          ! grep -rnE "\bsorry\b|native_decide|^\s*axiom\b" --include=*.lean ForgeMachineCore ForgeMachineCore.lean
          lake build
      - name: the axioms
        run: |
          lake env lean Axioms.lean | tee axioms.txt
          ! grep -E "sorryAx|ofReduceBool" axioms.txt
          test "$(grep -cE 'depends on axioms|does not depend on any axioms' axioms.txt)" -eq "$(grep -c '^#print axioms' Axioms.lean)"
          ! grep 'depends on axioms' axioms.txt | grep -vE '\[(propext|Classical.choice|Quot.sound)(, (propext|Classical.choice|Quot.sound))*\]$'
