# Hermle C 22 U: C GEN2 (High-Performance Line), HEIDENHAIN TNC7.
# X 450 Y 600 Z 330; 16000 rpm HSK-A63; 55 tools.
[[machine]]
name = "hermle-c-22-u"
kind = "table-table"
control = "heidenhain"
length_joint = "Z"
coolants = ["flood"]
clearance = 1
source = "https://www.hermle.de/en/machining-centres-automation/models/machining-centre-c-22-gen2/ | https://www.hermle.de/fileadmin/website/5_NEWS-UND-MEDIA/5_2_Mediathek/Technische_Daten/Englisch/HERMLE_Technical-Data_C22-GEN2_2025_EN.pdf"
taken = "2026-11-23"
note = "A tilts the cradle about X (-135..135 deg, published) and carries C; the sense of +A (which way the table tips) is UNKNOWN: modelled right-handed about +x; A's pivot below the table top UNKNOWN: 150 mm (estimate); which unit carries X/Y/Z: see the header (where not published, all on the head here); the tool-to-part motion is the same either way; spindle nose to table: the published maximum less the Z stroke; spindle power as published: peak/other 31 kW; torque max 98 N.m (no curve: no power check); max tool diameter 80 with the neighbouring pockets full, 125 with them empty; magazine options: HSK-A50/E40: 65 pockets, ZM 50 / ZM 88k / ZM 216 / ZM 528 additional magazines; machine 9000 kg; an unpublished required field takes the value that makes its check vacuous (rapid high, max feed = rapid, change time 0.001 s, tool weight 99 kg), named UNKNOWN beside it; joint 0 = mid-travel for X and Y and the top of travel for Z; the control's machine zero is at a travel end (which: UNKNOWN), so a real G54 differs by a constant per axis; bodies are single boxes/cylinders from published overall sizes; head, column, saddle, bed and turret sizes are estimates, the spindle housing radius kept large; the enclosure is not modelled."
real = true

