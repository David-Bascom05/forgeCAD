# The kernel's Rust, translated to Lean by Charon and Aeneas (verify/aeneas). First, translate
# every configured crate afresh and fail if a committed translation differs: the proofs are about
# the code as it is, and cannot go stale. Second, build the Lean: the float bridge, the
# translations, the proofs, and the axioms check (only propext, Classical.choice, Quot.sound).
#
# The pinned Charon and Aeneas (tools/aeneas/setup.sh, in ~/.cache/forge-aeneas) are built once
# per pin and patch set and cached; main's runs save them. The Lean projects verify/aeneas/*/lean
# build at once, one job each, each with its Lake build directories restored from main's latest
# (Lake rebuilds every module whose sources differ; tools/ci/lake-cache.py) and Mathlib from its
# own server (`lake exe cache get`).
name: aeneas

on:
  push:
    branches: [main]
    paths: ["kernel/**", "verify/aeneas/**", "verify/ieee754/**", "tools/aeneas/**",
      # what the verify/aeneas/*/lean packages require from outside verify/aeneas (lakefile paths)
      "research/kernel-audit/float-verification/**", "research/spline-loops/fp/**",
      "verify/forge-exact/**", "verify/forge-machine/**", "verify/forge-cam/**",
      "verify/forge-topo-check/**", "verify/sheet/**",
      ".github/workflows/aeneas.yml"]
  pull_request:
    paths: ["kernel/**", "verify/aeneas/**", "verify/ieee754/**", "tools/aeneas/**",
      # what the verify/aeneas/*/lean packages require from outside verify/aeneas (lakefile paths)
      "research/kernel-audit/float-verification/**", "research/spline-loops/fp/**",
      "verify/forge-exact/**", "verify/forge-machine/**", "verify/forge-cam/**",
      "verify/forge-topo-check/**", "verify/sheet/**",
      ".github/workflows/aeneas.yml"]
  workflow_dispatch:

# A new push to a pull request cancels that pull request's runs still queued or running for its
# older commits; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  translation-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # setup.sh's default home, ~/.cache/forge-aeneas: an absolute path (a path through `..` is
      # refused by the cache action, which is why the toolchain was rebuilt on every run). The
      # Charon build directory (charon-target) is left out: the built binaries are in charon/bin,
      # and setup.sh rebuilds only when their recorded pin differs.
      - name: toolchain cache (keyed on the pins and the patches)
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/forge-aeneas/aeneas
            ~/.cache/forge-aeneas/charon
            ~/.cache/forge-aeneas/bin
            ~/.cache/forge-aeneas/opam
            ~/.cache/forge-aeneas/charon-toolchain
            ~/.rustup/toolchains/nightly-*
          key: forge-aeneas-v2-${{ runner.os }}-${{ hashFiles('tools/aeneas/setup.sh', 'tools/aeneas/patches/**') }}
      - name: Charon and Aeneas at the pins (built once, then cached)
        if: ${{ github.event_name != 'push' || steps.tools.outputs.cache-hit != 'true' }}
        run: tools/aeneas/setup.sh
      - name: save the toolchain (main only, once per key)
        if: ${{ steps.tools.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/forge-aeneas/aeneas
            ~/.cache/forge-aeneas/charon
            ~/.cache/forge-aeneas/bin
            ~/.cache/forge-aeneas/opam
            ~/.cache/forge-aeneas/charon-toolchain
            ~/.rustup/toolchains/nightly-*
          key: forge-aeneas-v2-${{ runner.os }}-${{ hashFiles('tools/aeneas/setup.sh', 'tools/aeneas/patches/**') }}
      - name: every translation equals a fresh one
        if: ${{ github.event_name != 'push' }}
        run: tools/aeneas/translate.sh --all --check

  # Every verify/aeneas/*/lean, as the loop over that glob built them one after the other.
  projects:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          dirs=$(for d in verify/aeneas/*/lean; do printf '%s\n' "$d"; done | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "$dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  lean:
    needs: projects
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.projects.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
      - name: elan and the pinned toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat verify/aeneas/bridge/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$(cat ${{ matrix.dir }}/lean-toolchain)"
      - name: Lake cache key
        id: lake
        run: |
          name=aeneas-$(basename "$(dirname "${{ matrix.dir }}")")
          python3 tools/ci/lake-cache.py "$name" "${{ matrix.dir }}"
      - name: Lake build (restored; Lake rebuilds what changed)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.lake.outputs.paths }}
          key: ${{ steps.lake.outputs.key }}
          restore-keys: |
            ${{ steps.lake.outputs.prefix }}
            ${{ steps.lake.outputs.any }}
      - name: the bridge, the translation and its proofs
        if: ${{ github.event_name != 'push' || steps.restore.outputs.cache-hit != 'true' }}
        working-directory: ${{ matrix.dir }}
        run: |
          echo "== ${{ matrix.dir }}"
          for i in 1 2 3; do lake exe cache get && break; [ "$i" = 3 ] && exit 1; sleep 15; done  # Mathlib's server drops downloads now and then
          lake build
      - name: save the Lake build (main only, even when a check failed)
        if: ${{ always() && steps.lake.outcome == 'success' && steps.restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.lake.outputs.paths }}
          key: ${{ steps.lake.outputs.key }}
