[[dialect.cite]]
key = "native"
source = "https://cache.industry.siemens.com/dl/files/633/109443633/att_829767/v1/PGZ_1106_en.pdf"
taken = "2026-11-24"
where = "PGZ: CYCLE81 2.1.3 pp42-44, CYCLE800 3.16 p216, CYCLE832 3.17 pp265-268"
note = "CYCLE81: G0 to the reference plane shifted by the safety clearance, G1 to the final depth at the programmed feed, G0 to the retraction plane. CYCLE832 sets continuous-path mode, compression and velocity control from machine-specific settings: not modelled. CYCLE800() deselects the swivel data record and deletes the swivel frames"
