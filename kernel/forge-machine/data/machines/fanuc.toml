# FANUC ROBODRILL machines: the maker's published specifications, restated (never copied); each record's
# `source` is the page or catalogue read and `taken` the date. Estimates and UNKNOWNs are named in
# each record's `note` and beside the field. Bodies are conservative envelopes from published
# overall dimensions, not the maker's CAD. Format: docs/cam-machine.md.

# ---------------------------------------------------------------------------------------------
# FANUC ROBODRILL ALPHA-D21MIB5 Plus: BT30 drill/tap/mill centre, FANUC 31i-B5 Plus.
# X 500 Y 400 Z 330, table 650 wide (300 kg), 10,000 rpm (14.2 kW 1-min, 4 kW cont, 80 N.m max),
# 21 tools, cut to cut 1.6 s.
[[machine]]
name = "fanuc-robodrill-a-d21mib5"
kind = "vmc3"
control = "fanuc"
length_joint = "Z"
coolants = ["flood", "through"]
clearance = 1
source = "https://www.fanucamerica.com/products/robodrill/a-d21mib5-plus | https://www.fanucamerica.com/uploads/files/data-sheets/robodrill-a-d21mib5-plus.pdf | https://www.fanucamerica.com/uploads/files/data-sheets/robodrill-alphadib-plus-series-brochure.pdf"
taken = "2026-11-23"
note = "architecture assumed: X/Y table, Z head on a fixed column (FANUC's pages do not say which unit carries which axis: UNKNOWN); spindle centre to column UNKNOWN: put at the least that clears the table at full Y (estimate); nose to table 150-480 is the standard column (the high column HC100 option gives 250-580); spindle power published as ratings only (1-min 14.2 kW, cont 4.0 kW, 80 N.m max, 13.6 N.m cont): no curve, no power check; 24,000 rpm spindle and the ADV variant (cut to cut 1.3 s) are options; accel UNKNOWN; overall W/D/H only in a drawing not read (UNKNOWN); machine 2000 kg; joint 0 = mid-travel for X and Y and the top of travel for Z; the control's machine zero is at a travel end (which: UNKNOWN), so a real G54 differs by a constant per axis; bodies are single boxes/cylinders from published overall sizes; head, column, saddle, bed and turret sizes are estimates, the spindle housing radius kept large; the enclosure is not modelled."
real = true

[[machine.joint]]
name = "Y"
parent = "base"
side = "table"
type = "linear"
axis = [0, -1, 0]
range = [-200, 200]
rapid = 54000
max_feed = 30000

[[machine.joint]]
name = "X"
parent = "Y"
side = "table"
type = "linear"
axis = [-1, 0, 0]
range = [-250, 250]
rapid = 54000
max_feed = 30000

[[machine.joint]]
name = "Z"
parent = "base"
side = "head"
type = "linear"
axis = [0, 0, 1]
range = [-330, 0]
rapid = 54000
max_feed = 30000

[[machine.spindle]]
name = "S1"
link = "Z"
kind = "milling"
axis = [0, 0, 1]
nose = [0, 0, 480]
rpm = [1, 10000]   # rpm min UNKNOWN (unpublished): 1 = no lower check
max = [250, 80]
interface = "BT30 (BBT30 dual contact)"

[[machine.changer]]
pockets = 21
change_s = 1.6   # cut to cut with a 2 kg tool, published (tool to tool 0.9)
max_tool_kg = 3

[[machine.mount]]
name = "spindle"
kind = "tool"
link = "Z"
at = [0, 0, 480]
dir = [0, 0, -1]

[[machine.mount]]
name = "table"
kind = "part"
link = "X"
at = [0, 0, 0]
dir = [0, 0, 1]
xdir = [1, 0, 0]

[[machine.body]]
name = "bed"
link = "base"
part = "parts/fanuc/fanuc-robodrill-a-d21mib5/bed.fg"
ignore = ["saddle", "column"]
[[machine.body.box]]
min = [-325, -500, -700]
max = [325, 865, -400]

[[machine.body]]
name = "column"
link = "base"
part = "parts/fanuc/fanuc-robodrill-a-d21mib5/column.fg"
ignore = ["bed", "head"]
[[machine.body.box]]
min = [-300, 465, -400]
max = [300, 865, 1080]

[[machine.body]]
name = "saddle"
link = "Y"
part = "parts/fanuc/fanuc-robodrill-a-d21mib5/saddle.fg"
ignore = ["bed", "table"]
[[machine.body.box]]
min = [-260, -200, -250]
max = [260, 200, -100]

[[machine.body]]
name = "table"
link = "X"
part = "parts/fanuc/fanuc-robodrill-a-d21mib5/table.fg"
ignore = ["saddle"]
[[machine.body.box]]
min = [-325, -200, -100]
max = [325, 200, 0]

[[machine.body]]
name = "nose"
link = "Z"
part = "parts/fanuc/fanuc-robodrill-a-d21mib5/nose.fg"
ignore = ["column"]
[[machine.body.cyl]]
base = [0, 0, 480]
axis = [0, 0, 1]
r = 80
h = 150

[[machine.body]]
name = "head"
link = "Z"
part = "parts/fanuc/fanuc-robodrill-a-d21mib5/head.fg"
ignore = ["column"]
[[machine.body.box]]
min = [-110, -110, 630]
max = [110, 465, 1030]

