[package]
name = "forge-cli"
description = "Command-line driver for the ForgeCAD kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "forgecad"
path = "src/main.rs"

[dependencies]
forge-math = { path = "../../kernel/forge-math" }
forge-geom = { path = "../../kernel/forge-geom" }
forge-topo = { path = "../../kernel/forge-topo" }
forge-ops = { path = "../../kernel/forge-ops" }
forge-mesh = { path = "../../kernel/forge-mesh" }
forge-model = { path = "../../kernel/forge-model" }
forge-agent = { path = "../forge-agent" }

[lints]
workspace = true
