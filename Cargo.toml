[workspace]
resolver = "3"
members = ["kernel/*", "interface/*", "verify/*"]
# its own workspace, so wgpu never enters a kernel build or this Cargo.lock
exclude = ["interface/forge-render", "interface/forge-speech"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.commonty.org/david/ForgeCAD"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_cmp = "allow"
many_single_char_names = "allow"

[profile.test]
opt-level = 1

[profile.test.package.forge-math]
opt-level = 3
[profile.test.package.forge-geom]
opt-level = 3
[profile.test.package.forge-topo]
opt-level = 3
[profile.test.package.forge-bool]
opt-level = 3
[profile.test.package.forge-mesh]
opt-level = 3
[profile.test.package.forge-step]
opt-level = 3
[profile.test.package.forge-ops]
opt-level = 3
[profile.test.package.forge-model]
opt-level = 3
[profile.test.package.forge-sketch]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# the browser build: cargo build --profile wasm --target wasm32-wasip1
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
