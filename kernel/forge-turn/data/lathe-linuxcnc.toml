# LinuxCNC lathe (G7 diameter mode, G18): restated from the public LinuxCNC G-code reference;
# facts only. Verify with your configuration (tool table, offsets).
[dialect]
name = "linuxcnc-lathe"
extension = "ngc"
decimals = 3
feed_decimals = 3
pitch_decimals = 4
point = "always"
program_open = ["%", "({title})"]
program_close = ["M2", "%"]
comment = "({text})"
comment_strip = "()"
line_numbers = false
safe_start = ["G7 G18 G21 G40 G90 G95"]
tool_change = ["T{t} M6 G43 ({name})"]
css = ["G96 D{max} S{vc} M3"]
css_max_word = "D"
rpm = ["G97 S{rpm} M3"]
spindle_stop = "M5"
home = ["G28"]
thread = "G33"
thread_word = "K"
source = "forgecad, restated from the LinuxCNC G-code reference"
taken = "2026-11-23"
note = "verify with your configuration; arcs state I as a radius increment (G7 leaves I, K unscaled): verify"
