version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-math = { path = "../forge-math" }
forge-geom = { path = "../forge-geom" }
forge-topo = { path = "../forge-topo" }
forge-ops = { path = "../forge-ops" }
forge-dwg = { path = "../forge-dwg" }
forge-sheet-core = { path = "../forge-sheet-core" }

# forge-bool only as the trims' test oracle (the flat prism, Option B)
[dev-dependencies]
forge-bool = { path = "../forge-bool" }
forge-mesh = { path = "../forge-mesh" }
# the refold reference, for the tests (it lives in verify/, outside the kernel)
forge-refold = { path = "../../verify/forge-refold" }

[lints]
workspace = true
