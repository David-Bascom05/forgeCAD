# kernel/forge-topo, the Body methods boolean.rs's apply calls (D8's code half), translated for
# verify/forge-bool-proof through verify/aeneas/forge-bool-apply (which takes them as DEPS). A
# second translation of forge-topo, in its own package: verify/aeneas/forge-topo (check's views)
# is the first.
SRC_CRATE=forge-topo
PKG=ForgeTopoBody
CHARON_ARGS=(
  --start-from forge_topo::body::Body::add_edge
  --start-from forge_topo::body::Body::add_face
  --start-from forge_topo::body::Body::add_loop
  --start-from forge_topo::body::Body::add_shell
  --start-from forge_topo::body::Body::add_tolerant_vertex
  --start-from forge_topo::body::Body::face
  --start-from forge_topo::body::Body::kill_face
  --start-from forge_topo::body::Body::remove_loop
  --start-from forge_topo::body::Cached::get
  --start-from forge_topo::body::Cached::set
  --start-from forge_topo::body::VertexId::index
  --start-from '{impl core::ops::deref::DerefMut for forge_topo::small::Small}'
  --start-from '{impl core::clone::Clone for forge_topo::body::VertexId}'
  --start-from '{impl core::clone::Clone for forge_topo::body::EdgeId}'
  --start-from '{impl core::cmp::PartialEq for forge_topo::body::VertexId}'
  --start-from '{impl core::cmp::Ord for forge_topo::body::VertexId}'
  --start-from '{impl core::cmp::PartialEq for forge_topo::body::FaceId}'
  --start-from '{impl core::cmp::Eq for forge_topo::body::FaceId}'
  --start-from '{impl core::cmp::Ord for forge_topo::body::FaceId}'
  --start-from '{impl core::cmp::PartialOrd for forge_topo::body::FaceId}'
  --start-from '{impl core::cmp::PartialEq for forge_topo::body::ShellId}'
)
# The geometry is forge-geom's and forge-math's translations (DEPS); as there, the procedural
# wrappers are opaque values. The face's point-in-face cache is an opaque value.
DEPS=(forge-math forge-geom)
CHARON_ARGS+=(
  --opaque forge_geom::curve::ProcCurve
  --opaque forge_geom::surface::Proc
  --opaque forge_geom::intcurve::IntCurve
  --opaque forge_topo::body::FaceQuery
  --opaque 'forge_topo::body::{impl core::iter::traits::iterator::Iterator for forge_topo::body::Coedges}'
)
DROP_FIELDS=(size_hint)
