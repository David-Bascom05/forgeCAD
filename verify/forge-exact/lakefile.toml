name = "forgeexact"
version = "0.1.0"
defaultTargets = ["ForgeExact", "forge-exact", "sweep-ref"]

[leanOptions]
relaxedAutoImplicit = false
autoImplicit = false

# The spec and its proofs, and the executable reference they are proven about: core Lean only
# (no Mathlib, whose prebuilt cache this repository's machines cannot fetch), so one build checks
# both and the compiled reference links nothing else.
[[lean_lib]]
name = "ForgeExact"

# The reference's driver (ForgeExact/Ref/Input.lean gives its format).
[[lean_exe]]
name = "forge-exact"
root = "Main"

# The swept-solid reference (ForgeExact/Swept/Ref.lean gives its format): a kernel tool against
# its feature's definition.
[[lean_exe]]
name = "sweep-ref"
root = "SweepMain"
