name: ci
on:
  push:
    branches: [main]
  pull_request:

# a run on a commit always finishes: the default cancels it on the next push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs queue behind each other; once one finishes, only the newest commit needs the next.
  gate:
    runs-on: members
    outputs:
      newest: ${{ steps.tip.outputs.newest }}
    steps:
      - id: tip
        run: |
          tip=$(git ls-remote "https://code.commonty.org/${{ github.repository }}.git" "${{ github.ref }}" | cut -f1)
          # a door that does not answer runs the commit rather than skip it
          if [ "${{ github.event_name }}" = push ] && [ -n "$tip" ] && [ "$tip" != "${{ github.sha }}" ]; then new=false; else new=true; fi
          echo "tip $tip, this ${{ github.sha }}, run: $new"
          echo "newest=$new" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.newest == 'true'
    runs-on: members
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      # The members sandbox only reaches the internet, so clone from the public door, not git.<domain>.
      - name: checkout
        run: |
          git init -q .
          # the public door rate-limits (HTTP 429) when the jobs clone at once: back off and retry
          for i in 1 2 3 4 5; do git fetch -q --depth=1 "https://code.commonty.org/${{ github.repository }}.git" "${{ github.sha }}" && break; sleep $((i * 15)); done
          git checkout -q FETCH_HEAD
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (native)
        run: cargo test --workspace
      - name: test (wasm, same arithmetic as the browser)
        run: sh tools/test-wasm.sh
      # every part's exact result, native (n-ary on 4 threads) and as the browser build (1 thread)
      - name: bits (native and wasm agree bit for bit)
        run: |
          cargo build -q --release -p forge-model --example bits
          cargo build -q --profile wasm -p forge-model --example bits --target wasm32-wasip1
          target/release/examples/bits > bits-native.txt
          node --no-turbo-fast-api-calls tools/wasi-run.mjs target/wasm32-wasip1/wasm/examples/bits.wasm > bits-wasm.txt
          diff bits-native.txt bits-wasm.txt

  # forge-render is its own workspace: wgpu stays out of every job above. The GPU tests skip on a runner with no GPU.
  render:
    needs: gate
    if: needs.gate.outputs.newest == 'true'
    runs-on: members
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: checkout
        run: |
          git init -q .
          # the public door rate-limits (HTTP 429) when the jobs clone at once: back off and retry
          for i in 1 2 3 4 5; do git fetch -q --depth=1 "https://code.commonty.org/${{ github.repository }}.git" "${{ github.sha }}" && break; sleep $((i * 15)); done
          git checkout -q FETCH_HEAD
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: fmt, clippy, test
        working-directory: interface/forge-render
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: browser build
        working-directory: interface/forge-render
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

  scoreboard:
    needs: gate
    if: needs.gate.outputs.newest == 'true'
    runs-on: members
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: checkout
        run: |
          git init -q .
          # the public door rate-limits (HTTP 429) when the jobs clone at once: back off and retry
          for i in 1 2 3 4 5; do git fetch -q --depth=1 "https://code.commonty.org/${{ github.repository }}.git" "${{ github.sha }}" && break; sleep $((i * 15)); done
          git checkout -q FETCH_HEAD
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: build
        run: cargo build --release -p forge-model --example reliability --example suite
      - name: degeneracy scoreboard (no part worse than tools/reliability/baseline.txt)
        run: THREADS=4 target/release/examples/reliability --baseline tools/reliability/baseline.txt
      - name: suite parts and 150 fuzz histories, all valid
        run: FUZZ_SEEDS=150 target/release/examples/suite
      - name: metamorphic properties and certificates (no failure beyond tools/proof/known.txt)
        run: |
          cargo build --release -p forge-proof --example meta
          target/release/examples/meta seeds 150 count 20 adv 6 known tools/proof/known.txt
      # perf_event_open decides whether the speed gate (tools/speed/gate.sh) can run here
      - name: perf probe
        run: |
          python3 - <<'PY'
          import ctypes, os, struct
          attr = bytearray(128)
          struct.pack_into("IIQ", attr, 0, 0, 128, 1)  # PERF_TYPE_HARDWARE, size, instructions
          struct.pack_into("Q", attr, 40, 1 << 5 | 1 << 6)  # exclude_kernel, exclude_hv
          libc = ctypes.CDLL(None, use_errno=True)
          fd = libc.syscall(298, bytes(attr), 0, -1, -1, 0)
          print("perf_event_open:", "works" if fd >= 0 else os.strerror(ctypes.get_errno()))
          PY

  oracle:
    needs: gate
    if: needs.gate.outputs.newest == 'true'
    runs-on: members
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: checkout
        run: |
          git init -q .
          # the public door rate-limits (HTTP 429) when the jobs clone at once: back off and retry
          for i in 1 2 3 4 5; do git fetch -q --depth=1 "https://code.commonty.org/${{ github.repository }}.git" "${{ github.sha }}" && break; sleep $((i * 15)); done
          git checkout -q FETCH_HEAD
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # OpenCascade is a test oracle only: a venv outside the checkout, never a Cargo dependency
      - name: opencascade
        run: |
          # OCP's module loads libGL even headless
          apt-get update -qq && apt-get install -y -qq python3.11 python3.11-venv libgl1
          PYTHON=python3.11 VENV="$HOME/occt" sh tools/occt/setup.sh
      - name: export parts
        run: |
          cargo build --release -p forge-model --example oracle
          # every feature kind: the suite, finishing ops, fillets, face edits, part files, and the real parts once they land
          sets=suite,torture,finishing,fillets,edits,models,fuzz:20
          if [ -d tools/bench-parts ]; then sets=$sets,dir:tools/bench-parts; fi
          THREADS=2 REPS=1 target/release/examples/oracle $sets > parts.json
      - name: oracle gate (disagreements outside tools/occt/known.txt fail)
        run: |
          "$HOME/occt/bin/python" -u tools/occt/oracle.py parts.json --jobs 4 --timeout 150 \
            --show 0 --gate --known tools/occt/known.txt
