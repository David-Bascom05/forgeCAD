# The Lean proofs: research/forge-lang (the language's editability and grammar), check-local and
# drag-speed, each `lake build` on the pinned toolchain, then their axiom checks. A theorem that
# no longer checks, a `sorry`, `native_decide` or any axiom past propext, Classical.choice and
# Quot.sound fails the job. The toolchain (~/.elan) and each project's .lake are cached.
name: lean

on:
  push:
    branches: [main]
    paths: ["research/**/*.lean", "research/**/lean-toolchain", "research/**/lakefile.toml",
            "research/**/lake-manifest.json", "interface/forge-lang/grammar.ll1",
            "interface/forge-lang/src/**", "interface/forge-lang/tests/parse_diff*",
            "kernel/forge-geom/src/spline.rs", "kernel/forge-geom/tests/spline_diff*",
            ".github/workflows/lean.yml"]
  pull_request:
    paths: ["research/**/*.lean", "research/**/lean-toolchain", "research/**/lakefile.toml",
            "research/**/lake-manifest.json", "interface/forge-lang/grammar.ll1",
            "interface/forge-lang/src/**", "interface/forge-lang/tests/parse_diff*",
            "kernel/forge-geom/src/spline.rs", "kernel/forge-geom/tests/spline_diff*",
            ".github/workflows/lean.yml"]
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('research/forge-lang/lean/lean-toolchain', 'research/check-local/lean/lean-toolchain', 'research/drag-speed/lean/lean-toolchain') }}
      - name: build cache
        uses: actions/cache@v4
        with:
          path: |
            research/forge-lang/lean/.lake
            research/check-local/lean/.lake
            research/drag-speed/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('research/**/lean-toolchain') }}-${{ hashFiles('research/forge-lang/lean/**/*.lean', 'research/check-local/lean/**/*.lean', 'research/drag-speed/lean/**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('research/**/lean-toolchain') }}-
      - name: elan and the pinned toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for d in research/forge-lang/lean research/check-local/lean research/drag-speed/lean; do
            "$HOME/.elan/bin/elan" toolchain install "$(cat $d/lean-toolchain)"
          done
      - name: forge-lang
        working-directory: research/forge-lang/lean
        run: |
          # the two kernel `decide`s of the parser's grammar take ~8 GB each: one at a time
          lake build ForgeLang.LL1.Impl
          lake build ForgeLang.LL1.ImplUnifiedDoc
          lake build
          lake build fgparse fglex  # the oracles of tests/parse_diff.rs
          lake env lean CheckAxioms.lean
          lake env lean Axioms.lean | tee axioms.txt
          ! grep -E "sorryAx|ofReduceBool" axioms.txt
      - name: parser and lexer against the Lean oracle
        # Any change to the .fg language must carry its proof: the Rust lexer and parser are
        # compared answer by answer with the Lean model (lake exe fgparse/fglex), and the committed
        # digest must be what the oracle gives.
        run: |
          rustup show
          FG_LEAN=1 cargo test --release --locked -p forge-lang --test parse_diff
          git diff --exit-code interface/forge-lang/tests/parse_diff.digest
      - name: check-local
        if: ${{ !cancelled() }}
        working-directory: research/check-local/lean
        run: |
          lake build
          lake env lean Axioms.lean | tee axioms.txt
          ! grep -E "sorryAx|ofReduceBool" axioms.txt
      - name: drag-speed
        if: ${{ !cancelled() }}
        working-directory: research/drag-speed/lean
        run: |
          lake build
          lake env lean Axioms.lean | tee axioms.txt
          ! grep -E "sorryAx|ofReduceBool" axioms.txt

  # research/loft-ssi/derive/proofs and proofs-alt need Mathlib (v4.36.0-rc2), fetched with its
  # build cache. Not built where this job was written (the Mathlib cache host was not reachable
  # there), so informative until a run shows it green.
  loft-ssi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        dir: [research/loft-ssi/derive/proofs, research/loft-ssi/derive/proofs-alt]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles(format('{0}/lean-toolchain', matrix.dir)) }}
      - name: Mathlib cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/.lake
          key: lake-mathlib-${{ runner.os }}-${{ hashFiles(format('{0}/lakefile.toml', matrix.dir), format('{0}/lake-manifest.json', matrix.dir)) }}
      - name: elan, the toolchain, Mathlib's build
        working-directory: ${{ matrix.dir }}
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lake" exe cache get
      - name: build
        working-directory: ${{ matrix.dir }}
        run: lake build

  # research/spline-loops/lean: the specification of .fg's splines (SplineSpec) and the Bernstein
  # certificates (SplineLoops), on Mathlib v4.36.0-rc2 fetched with its build cache; then the kernel's
  # splines against the spec's oracle (lake exe splineoracle) and the committed digest.
  spline-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('research/spline-loops/lean/lean-toolchain') }}
      - name: Mathlib cache
        uses: actions/cache@v4
        with:
          path: research/spline-loops/lean/.lake
          key: lake-spline-${{ runner.os }}-${{ hashFiles('research/spline-loops/lean/lakefile.toml', 'research/spline-loops/lean/lake-manifest.json') }}-${{ hashFiles('research/spline-loops/lean/**/*.lean') }}
          restore-keys: lake-spline-${{ runner.os }}-${{ hashFiles('research/spline-loops/lean/lakefile.toml', 'research/spline-loops/lean/lake-manifest.json') }}-
      - name: elan, the toolchain, Mathlib's build
        working-directory: research/spline-loops/lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lake" exe cache get
      - name: build and axioms
        working-directory: research/spline-loops/lean
        run: |
          lake build
          lake env lean CheckAxioms.lean
          lake env lean Axioms.lean | tee axioms.txt
          ! grep -E "sorryAx|ofReduceBool" axioms.txt
      - name: the kernel's splines against the spec
        run: |
          rustup show
          FG_LEAN=1 cargo test --release --locked -p forge-geom --test spline_diff
          git diff --exit-code kernel/forge-geom/tests/spline_diff.digest
