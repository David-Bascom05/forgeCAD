# ---------------------------------------------------------------------------------------------
# Spinner U5-620 (out of production: Spinner's site no longer lists it, so no maker page or
# brochure could be read). The machine of the RPTU/Spinner dataset (ElMoe, CC BY 4.0: "recorded
# from a Siemens 840D-SL machine control on a five-axis milling machine tool of type 'Spinner
# U5-620'"). Every value here is from used-machine dealer listings that restate the maker's
# data, so each is an `estimate` (or a `conflict` where the listings disagree), never `published`.
# X 620 Y 520 Z 460; B swivel, C 360; 12000 rpm SK40; 32 tools.
[[machine]]
name = "spinner-u5-620"
kind = "table-table"
control = "siemens"
length_joint = "Z"
coolants = ["flood"]
clearance = 1
source = "https://www.asset-trade.de/en/universal-machine-centres/spinner-u5-620-5-axis-1020-05131318 | https://www.gindumac.com/product/spinner-u5-620_DE-MIL-SPI-2017-00001 | https://www.used-machines.com/spinner-u5-620/gm-216-40308 | https://www.machinetools.com/en/models/spinner-u5-620"
taken = "2026-11-24"
note = "Out of production; no maker document could be read (spinner.eu.com lists only the U5-630 and later; archived pages not reachable): every value is a dealer listing's restatement, cited estimate, or conflict where they disagree. B tilts the cradle and carries C. Fitted from the dataset's own log (tools/machines/spinner_u5_620_fit.py; estimates fitted from logs, never published): B turns about y and C about z, both negatively (+B right-handed about -y: at B+90 the table top faces -x; +C clockwise seen from above); the C axis stands at the control's machine X 0.18, Y 0.09; the B axis lies on b_x + b_z = 49.48 in machine coordinates, and with B and C taken as intersecting (an assumption: the log holds B only at 0 and 90 under TRAORI, so the rest is confounded with unpublished tool lengths) 49.3 mm above the table top. With the C axis at the record's origin and the table top at machine Z 0 (the log's Z 152.6-610 matches Asset-Trade's nose-to-table 150-610), this record's X and Y are the control's machine coordinates and its Z is machine Z - 610. B range in conflict: Asset-Trade +5 (+50 option) / -110, another listing -5 (-90) / +110, another +60 / -140; -91..+110 used, in the control's sense (what programs command): the dataset's own program Coordinate_system_representation_Achskreuz.mpf (ElMoe, CC BY 4.0) commands G0 B90. on this machine with no transformation active (N10290, N10610, N15330, N15970), and its log reaches B-91 (JOG); Asset-Trade's +5 / -110 fits only with the opposite sign convention. Control: the dataset's programs are Siemens 840D native; `control` stays forge-post's siemens until its 840D dialect lands. Z in conflict: 460 (most listings) vs 420 (one 2008 listing): 460 used. Spindle: 12000 rpm in the listings (a family brochure is reported to give 9000 standard, 12000 optional: not read); power 22 kW peak / 135 N·m (Asset-Trade) vs 19 kW / 121 N·m (another): no power check. Rapid 48 m/min given as one 'feed / rapid' value: per-axis rapids and max cutting feed UNKNOWN. Rotary speeds UNKNOWN. Spindle nose to table 150-610 mm (Asset-Trade) sets the nose at 610 above the table at the top of Z. Tool: 32 pockets, max length 290, diameter 76 (127 with free neighbours), 7 kg (Asset-Trade). Control: Siemens 840D-SL on the dataset's machine (dealer listings also show Heidenhain TNC 620 machines). X and Y ranges: the listed travels placed so the log's machine positions (X -365..90.1, Y -200..224) lie inside, the programs' SUPA home (X-365 Y224) taken as the travels' ends (an assumption); Z 0 is the top of travel (the home Z610). Bodies are single boxes/cylinders, estimates kept large where the tool and part move; the enclosure is not modelled."
real = true

[[machine.joint]]
name = "X"
parent = "base"
side = "head"
type = "linear"
axis = [1, 0, 0]
range = [-365, 255]
rapid = 48000
max_feed = 48000   # max cutting feed UNKNOWN: = rapid, no feed clamp

[[machine.joint]]
