name = "forgemath"
version = "0.1.0"
defaultTargets = ["ForgeMath"]

# The float bridge: Aeneas's library, verify/ieee754, and f64 as binary64.
[[require]]
name = "aeneasf64"
path = "../../bridge"

[[lean_lib]]
name = "ForgeMath"

# The ieee session's theorems about the predicates' fast paths (stated for their respelled copy);
# ForgeMath/Predicates.lean carries them over to this translation of the real crate.
[[require]]
name = "floatverification"
path = "../../../../research/kernel-audit/float-verification/lean"
