[package]
name = "forge-gpu"
description = "Experimental: n-ary boolean region verdicts on an NVIDIA GPU (CUDA driver, loaded at run time)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-math = { path = "../forge-math" }
forge-bool = { path = "../forge-bool" }

# the one crate allowed unsafe code: calls into the CUDA driver library
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
float_cmp = "allow"
many_single_char_names = "allow"

