# Native clippy, warnings as errors: the root workspace (every crate, every target) and
# interface/forge-render (its own workspace; web.yml lints only its wasm32 library). Before this,
# CI's only clippy was that wasm32 lib, so a native-only warning reached main unseen (train 6:
# forge-topo body.rs). The two run in parallel, each with its own cache, saved from main only.
name: clippy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  forge-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: interface/forge-render
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: interface/forge-render -> target
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: cargo clippy --all-targets --locked -- -D warnings
