[package]
name = "forge-server"
description = "Hosted forgeCAD's server (phase 1: one process): the op log's sequencer, a durable store, WebSocket, broadcast, and named versions as forge-history commits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dependencies]
forge-sync = { path = "../forge-sync" }
forge-ws = { path = "../forge-ws" }
forge-lang = { path = "../forge-lang" }
forge-agent = { path = "../forge-agent" }
forge-history = { path = "../forge-history" }
forge-git = { path = "../../kernel/forge-git" }
forge-keep = { path = "../forge-keep" }

[features]
# a test-only op that panics a document's actor (tests/security.rs: quarantine)
test-hooks = []

[lints]
workspace = true

[dev-dependencies]
forge-remote = { path = "../forge-remote" }
forge-server = { path = ".", features = ["test-hooks"] }
