note = "Sense directions ±X, ±Y, +Z; operating range up to 5 m."
real = true
sensing = "contact"
transmission = "optical"
repeat = 0.001
overtravel = [12.5, 6]
mass = 0.25
body = [[20, 0, 69]]
[[probe.cite]]
path = "transmission"
status = "published"
source = "https://www.renishaw.com/resourcecentre/en/download/data-sheet-omp40-2--144696 (Renishaw data sheet OMP40-2 optical machine probe, H-4071-8200-08-A, issued 10.2025)"
taken = "2026-11-24"
value = "transmission type: 360° infrared optical"
[[probe.cite]]
path = "repeat"
status = "published"
source = "https://www.renishaw.com/resourcecentre/en/download/data-sheet-omp40-2--144696 (Renishaw data sheet OMP40-2 optical machine probe, H-4071-8200-08-A, issued 10.2025)"
taken = "2026-11-24"
value = "unidirectional repeatability 1.00 µm 2σ, tested at 480 mm/min with a 50 mm stylus"
[[probe.cite]]
path = "overtravel"
status = "published"
source = "https://www.renishaw.com/resourcecentre/en/download/data-sheet-omp40-2--144696 (Renishaw data sheet OMP40-2 optical machine probe, H-4071-8200-08-A, issued 10.2025)"
taken = "2026-11-24"
value = "stylus overtravel ±12.5° in the XY plane, 6 mm in +Z (50 mm stylus: ±12 mm XY; 100 mm stylus: ±22 mm XY)"
[[probe.cite]]
path = "mass"
status = "published"
source = "https://www.renishaw.com/resourcecentre/en/download/data-sheet-omp40-2--144696 (Renishaw data sheet OMP40-2 optical machine probe, H-4071-8200-08-A, issued 10.2025)"
taken = "2026-11-24"
value = "weight without shank, including batteries, 250 g"
[[probe.cite]]
path = "body"
status = "estimate"
source = "https://www.renishaw.com/resourcecentre/en/download/data-sheet-omp40-2--144696 (Renishaw data sheet OMP40-2 optical machine probe, H-4071-8200-08-A, issued 10.2025)"
taken = "2026-11-24"
value = "drawing: Ø40 mm body; axial lengths 50 mm and 19 mm"
basis = "the dimension drawing's axial lengths cannot be tied to the body's ends from the text; the envelope is a Ø40 mm cylinder 69 mm long from the stylus mounting face toward the shank, the most the stated lengths add to (errs large)"
[[probe.cite]]
path = "max_feed"
status = "unknown"
basis = "the data sheet gives only its test velocity (480 mm/min with a 50 mm stylus) and says higher is possible; no maximum is stated"
[[probe.cite]]
path = "stylus"
status = "unknown"
basis = "styli are bought separately (the sheet recommends ceramic styli 50 to 150 mm long, M4 thread) and no ball size is stated: the setup gives the stylus"

