[package]
name = "forge-cam-lang"
description = "The machining document: CAM in .fg (`forgecad cam`), its reply forgecad.cam/1 and setup sheet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# the filesystem a browser page has too (its in-memory tree)
forge-dirs = { path = "../../kernel/forge-dirs" }
# machines as data and the posted text simulated on them (the app's machine simulation)
forge-machine = { path = "../../kernel/forge-machine" }
forge-lang = { path = "../forge-lang" }
forge-agent = { path = "../forge-agent" }
forge-cam = { path = "../../kernel/forge-cam" }
forge-cam-geom = { path = "../../kernel/forge-cam-geom" }
forge-tooling = { path = "../../kernel/forge-tooling" }
forge-material = { path = "../../kernel/forge-material" }
# tool instances as a library kind (cam/tool-instances/ at the project and user levels)
forge-library = { path = "../forge-library" }
forge-post = { path = "../../kernel/forge-post" }
forge-model = { path = "../../kernel/forge-model" }
forge-math = { path = "../../kernel/forge-math" }
forge-sketch = { path = "../../kernel/forge-sketch" }

[lints]
workspace = true
