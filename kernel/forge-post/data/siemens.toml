# SINUMERIK 840D sl (ISO Dialect mode, G291), milling: restated from Siemens' openly published
# "Programming Manual ISO Milling" 04.2007 (6FC5398-7BP10-0BA0) and "Fundamentals" 03/2013
# (6FC5398-1BP40-3BA1); every code is cited below. The 2007 ISO manual's validity list names the
# 840D sl (SW 1.4), not the 828D: verify on an 828D. Machine-data-dependent behaviour is noted.
[dialect]
name = "siemens"
extension = "mpf"
decimals = 3
feed_decimals = 1
units_mm = "G21"
units_inch = "G20"
inch_decimals = 4
inch_feed_decimals = 2
point = "always"
program_open = ["G291", "({title})"]
program_close = ["M30"]
comment = "({text})"
comment_strip = "();"
line_numbers = true
line_start = 10
line_step = 10
safe_start = ["{units}", "G90 G94 G17 G40 G49 G80"]
tool_change = ["T{t} M6"]
length_comp = "G00 G43 H{h}"
spindle_cw = "S{rpm} M03"
spindle_ccw = "S{rpm} M04"
spindle_stop = "M05"
wcs = "G{n}"
wcs_first = 54
wcs_count = 6
arc = "ijk"
retract_home = ["G91 G28 Z0.", "G90"]
coolant_flood = "M08"
coolant_off = "M09"
dwell = "G04 X{s}"
cycle_drill = "G98 G81 X{x} Y{y} Z{z} R{r} F{f}"
cycle_dwell = "G98 G82 X{x} Y{y} Z{z} R{r} P{ms} F{f}"
cycle_peck = "expand"
cycle_chipbreak = "expand"
cycle_tap = "G98 G84 X{x} Y{y} Z{z} R{r} F{f}"
cycle_ream = "G98 G85 X{x} Y{y} Z{z} R{r} F{f}"
cycle_next = "X{x} Y{y}"
cycle_cancel = "G80"
read_g_ignore = [291]
cite_required = true
source = "Siemens SINUMERIK Programming Manual ISO Milling 04.2007; Fundamentals 03/2013 (cited per code)"
taken = "2026-11-23"
note = "posted with a decimal point on every coordinate: without one the value depends on MD 10884; G84's F is a feed (G94) unless $MC_EXTERN_FUNCTION_MASK bit 8 makes it the pitch"

[[dialect.cite]]
key = "program_open"
source = "https://cache.industry.siemens.com/dl/files/188/28755188/att_27502/v1/PGM_0407_en.pdf"
taken = "2026-11-23"
where = "1.1.3 p. 1-12; 3.2.2 p. 3-60"
note = "G291 alone in the first block selects ISO Dialect mode (unless machine data boots in it); a comment names the program"

[[dialect.cite]]
key = "program_close"
source = "https://cache.industry.siemens.com/dl/files/188/28755188/att_27502/v1/PGM_0407_en.pdf"
taken = "2026-11-23"
where = "3.6.3 pp. 3-87..3-88"
note = "M30 end of tape"

[[dialect.cite]]
key = "comment"
source = "https://cache.industry.siemens.com/dl/files/188/28755188/att_27502/v1/PGM_0407_en.pdf"
taken = "2026-11-23"
where = "1.1.7 p. 1-15"
note = "( ) comments; ; to end of line also accepted"

[[dialect.cite]]
key = "line_numbers"
