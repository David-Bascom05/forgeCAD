# Windows Defender scans every file cargo writes when real-time protection is on. Exclude the
# checkout, cargo's home and rustup's toolchains from it; a no-op where Defender is already off.
name: defender-exclude
description: Exclude the build directories from Windows Defender's real-time scan
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $s = Get-MpComputerStatus -ErrorAction SilentlyContinue
        "real-time protection: $($s.RealTimeProtectionEnabled)"
        if ($s -and $s.RealTimeProtectionEnabled) {
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Continue
          Add-MpPreference -ExclusionProcess cargo.exe, rustc.exe, link.exe -ErrorAction Continue
        }
        exit 0
