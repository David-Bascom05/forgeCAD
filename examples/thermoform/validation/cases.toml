[[case]]
id = "atmani2020_plugonly_dry130_plug"
model = "atmani2020_plugonly_cavity.fg"
data = "s2_atmani2020_plugonly_thickness.csv"
mode = "arc"
s_col = "s_mm"
t_col = "t_130C_dry_mm"
t0 = 1.1
cut_deg = 0
axisym = true
fold_about = 85.0
plug = [21, 90, 10, 20, 60]
# Coulomb friction on the plug: Atmani 2020 Table 2, f(T) = 0.2 (1 + exp[-1040 (1/T - 1/107)]) at the plug-sheet
# interface, the plug heated to the sheet's 130 C: f = 1.316 (s2_mat_friction_atmani2020.csv). Was sticking.
plug_mu = 1.316
how = "arc length from the centre (data folded about s = 85), a dry plug, Atmani's friction at 130 C"
cause = "plug: Coulomb friction on the plug (Atmani f(T)); stroke 60 printed"

