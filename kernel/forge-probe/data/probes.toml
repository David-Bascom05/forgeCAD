# Probing devices (forge-probe): spindle work probes and tool setters, restated from the makers'
# own openly published data sheets (renishaw.com resource centre, no sign-up), read 2026-11-24.
# Every value is cited ([[probe.cite]]); a value a sheet does not state is left out and cited
# unknown, so every check that needs it reports "not checked". Verify with the maker before
# relying on a clearance.

