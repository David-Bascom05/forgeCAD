status = "estimate"
basis = "forgeCAD's own round placeholder (the generic set since the first CAM commit); no source behind the number; mid-range for unalloyed carbon steel, verify with the tool maker"
[[group.cite]]
path = "vc_hss"
status = "estimate"
basis = "forgeCAD's own round placeholder (the generic set since the first CAM commit); no source behind the number; mid-range for unalloyed carbon steel, verify with the tool maker"
[[group.cite]]
path = "fz_d1"
status = "estimate"
basis = "forgeCAD's own round placeholder (the generic set since the first CAM commit); no source behind the number; a starting chip, verify with the tool maker"
[[group.cite]]
path = "fz_d20"
status = "estimate"
basis = "forgeCAD's own round placeholder (the generic set since the first CAM commit); no source behind the number; a starting chip, verify with the tool maker"
[[group.cite]]
path = "kc1_1"
status = "estimate"
basis = "inside the measured Ck45 (AISI 1045) range 1368-1935 N/mm2 over vc 10-450 m/min (orthogonal dry turning, uncoated Sandvik CCMW 09T304 H13A, rake 0 deg, kr 90 deg, fitted per vc by extrapolating kc to h = 1 mm (paper section 3.7)); a round mid value, not one measurement; other P steels not covered"
[[group.cite]]
path = "mc"
status = "estimate"
basis = "inside the measured Ck45 range 0.17-0.51 (orthogonal dry turning, uncoated Sandvik CCMW 09T304 H13A, rake 0 deg, kr 90 deg, fitted per vc by extrapolating kc to h = 1 mm (paper section 3.7)); the power is also checked at the range's upper end"
[[group.cite]]
path = "kc1_1_range"
status = "published"
source = "https://arxiv.org/abs/2209.04197"
taken = "2026-11-24"
value = "Ck45 kc1.1 [N/mm2] at vc 10,30,50,70,100,150,200,250,300,350,450 m/min: 1935,1803,1417,1729,1672,1707,1716,1794,1851,1575,1368"
note = "Klippel, Suessmaier, Kuffa, Wegener, 'Dry Cutting Experiments Database Ti6Al4V and Ck45', ETH Zurich IWF, arXiv:2209.04197 v1 (2022), CC BY 4.0; read from the authors' TeX source (Kienzle_LtxTabelle_*.inc, the paper's Tables 16/17); orthogonal dry turning, uncoated Sandvik CCMW 09T304 H13A, rake 0 deg, kr 90 deg, fitted per vc by extrapolating kc to h = 1 mm (paper section 3.7). Ck45 only"
[[group.cite]]
path = "mc_range"
status = "published"
source = "https://arxiv.org/abs/2209.04197"
taken = "2026-11-24"
value = "Ck45 mc at the same vc: 0.19,0.17,0.51,0.35,0.32,0.28,0.26,0.22,0.22,0.27,0.29"
note = "Klippel, Suessmaier, Kuffa, Wegener, 'Dry Cutting Experiments Database Ti6Al4V and Ck45', ETH Zurich IWF, arXiv:2209.04197 v1 (2022), CC BY 4.0; read from the authors' TeX source (Kienzle_LtxTabelle_*.inc, the paper's Tables 16/17); orthogonal dry turning, uncoated Sandvik CCMW 09T304 H13A, rake 0 deg, kr 90 deg, fitted per vc by extrapolating kc to h = 1 mm (paper section 3.7). Ck45 only"

