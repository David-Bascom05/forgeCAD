# Cutting data per ISO 513 group for general carbide and HSS end milling, each value cited
# (cite.rs): `published` where a source states it, `estimate` where it is our number with its
# basis, `unknown` where nothing was read. The speeds and chips are forgeCAD's own round starting
# points: verify with the tool maker for the tool and the material. A tool's own data
# ([[tool.preset]]) and the user's values are used over these (forge_tooling::resolve).
#
# Measured Kienzle data: Klippel H., Suessmaier S., Kuffa M., Wegener K., "Dry Cutting
# Experiments Database Ti6Al4V and Ck45", arXiv:2209.04197 (2022), licensed CC BY 4.0
# (https://creativecommons.org/licenses/by/4.0/). Values restated as ranges with attribution.

