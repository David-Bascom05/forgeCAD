[package]
name = "forge-asm"
description = "Assemblies for ForgeCAD: instances, joints between anchor frames, the solver, checks and BOM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The narrow phase's old two walks and per-triangle near_surface (before narrow_near and
# near_all), kept one train for comparison builds only:
# `cargo build --release -p forge-cli -p forge-asm --features forge-asm/two-walks`.
two-walks = []

[dependencies]
forge-math = { path = "../forge-math" }
forge-geom = { path = "../forge-geom" }
forge-topo = { path = "../forge-topo" }
forge-bool = { path = "../forge-bool" }
forge-mesh = { path = "../forge-mesh" }
forge-step = { path = "../forge-step" }

[dev-dependencies]
forge-ops = { path = "../forge-ops" }

[lints]
workspace = true
