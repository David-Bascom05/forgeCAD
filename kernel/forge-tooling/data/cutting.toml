# materials.toml (machining.* keys), not here: this file is tool-side and generic group data.

# Generic drilling data per group and drill substrate: vc and the feed per revolution at stated
# diameters (linear between; outside, the lesser of the linear and proportional extension). Each
# row is one maker's series (Guhring's catalog values, already cited on its drill records in
# tools/guhring.toml) held for drills of that substrate with no data of their own: an estimate,
# said per value. A drill's own preset and the user's values come first.

