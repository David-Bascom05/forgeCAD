# SendCutSend, restated from its public design guidelines (read 2026-11-22). Not an official
# profile and not endorsed by SendCutSend. Verify with the vendor before ordering.
# Sources and the choices made where its pages disagree: research/sheet-metal/vendors/sendcutsend.md
format = 1
id = "sendcutsend"
name = "SendCutSend"
source = "https://sendcutsend.com/guidelines/ ; https://sendcutsend.com/bending-calculator/ ; https://sendcutsend.com/materials/processing-min-max/ ; https://sendcutsend.com/guidelines/hardware/catalog/"
taken = "2026-11-22"
units = "in"
note = "Restated from SendCutSend's public pages: bend radius, K, deduction, die width, minimum flange and relief depth per stock from its bending calculator; limits from its bending, cutting and processing pages. Not official. Verify with the vendor before ordering."
operations = ["laser", "waterjet", "bend", "countersink", "tap", "hardware", "powder_coat", "deburr"]

[limits]
max_flat = [44, 68]          # instant quote, cut parts
max_flat_bent = [30, 44]     # bending page
max_flat_coated = [30, 36]   # powder coating
min_flat = [0.25, 0.375]
min_flat_bent = [0.375, 1.5]
max_bend_length = 44
max_box_flange = 3           # a four-sided box with hardware
box_flange_when = "hardware"
bend_angles = [0, 130]

[tolerance]
cut = "+/-0.005 in laser (parts under 12 in), +/-0.010 in over 12 in; +/-0.009 in waterjet"
bend_angle = "+/-1 deg for bends up to 24 in long, +/-2 deg longer"
bend_to_edge = "+/-0.015 in, and at least 0.015 in more for each further bend"
hardware_hole = "+0.003/-0.000 in"
countersink = "+/-0.015 in"

[rules]
min_hole = "0.5t"            # laser; the material pages recommend 1t
min_slot = "0.5t"
min_web = "0.5t"             # bridges between features
hole_to_edge = "0.5t"        # a bridge to the edge; the 5052 page recommends 2t
bend_from = "centre"
relief = { shape = "rect", width = "0.5t", depth = "t + r + 0.02", corner_gap = 0.015 }

