name = "winding2d"
version = "0.1.0"
defaultTargets = ["Winding2d"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The signed winding number of a rational polygon, and its theorems: core Lean only (no Mathlib),
# so that sketch text, sheet metal and the boolean import one proof instead of three.
[[lean_lib]]
name = "Winding2d"
