key = "program_open"
source = "https://knowledgebase.tormach.com/8l/pathpilot-post-processor-guidelines"
taken = "2026-11-23"
where = "Tormach Knowledge Base: PathPilot Post Processor Guidelines, web page, undated (covers Mill/Router, Lathe, Plasma); Miscellaneous / M98-M99 entries"
note = "no start code; no % at the start or end"

