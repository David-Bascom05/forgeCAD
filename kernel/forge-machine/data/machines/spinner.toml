side = "table"
type = "rotary"
axis = [0, -1, 0]   # +B turns the table right-handed about -y: fitted from the log (note)
pivot = [0, 0, 49.3]   # estimate fitted from the log, B and C taken as intersecting (note)
range = [-91, 110]
rapid = 360000   # UNKNOWN (unpublished): a high value keeps t_min a lower bound
max_feed = 360000   # rotary max feed UNKNOWN: = rapid
