# Kitamura Mycenter-3XV: Mycenter XV vertical (successor of 3XiF; sold in US as Mycenter-3XVII), Kitam
# X 760 Y 510 Z 510; 15000 rpm NST No.40 (dual contact per US page); 30 tools.
[[machine]]
name = "kitamura-mycenter-3xv"
kind = "vmc3"
control = "fanuc"
length_joint = "Z"
coolants = ["flood"]
clearance = 1
source = "https://www.kitamura-machinery.com/products/mycenter3xv/ | https://kitamura-machinery.co.jp/products/%e7%ab%8b%e5%bd%a2%e3%83%9e%e3%82%b7%e3%83%8b%e3%83%b3%e3%82%b0%e3%82%bb%e3%83%b3%e3%82%bf/p-5414/ | https://kitamura-machinery.co.jp/products/%e7%ab%8b%e5%bd%a2%e3%83%9e%e3%82%b7%e3%83%8b%e3%83%b3%e3%82%b0%e3%82%bb%e3%83%b3%e3%82%bf/"
taken = "2026-11-23"
note = "architecture assumed: X table on a Y saddle, Z head on a fixed column (the maker's page does not say which unit carries which: UNKNOWN unless stated above); spindle centre to column UNKNOWN: put at the least that clears the table at full Y (estimate); spindle nose to table UNKNOWN: 150 to 150 + Z (estimate); spindle power as published: peak/other: 31 kW (42 hp) on JP listing; US page says 41 hp; torque max 141 N.m (no curve: no power check); max tool length UNKNOWN: 1000 (no check); max tool diameter UNKNOWN: 500 (no check); overall 2415 x 2245 x None; an unpublished required field takes the value that makes its check vacuous (rapid high, max feed = rapid, change time 0.001 s, tool weight 99 kg), named UNKNOWN beside it; joint 0 = mid-travel for X and Y and the top of travel for Z; the control's machine zero is at a travel end (which: UNKNOWN), so a real G54 differs by a constant per axis; bodies are single boxes/cylinders from published overall sizes; head, column, saddle, bed and turret sizes are estimates, the spindle housing radius kept large; the enclosure is not modelled."
real = true

[[machine.joint]]
name = "Y"
parent = "base"
side = "table"
type = "linear"
axis = [0, -1, 0]
range = [-255, 255]
rapid = 52000
max_feed = 52000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.joint]]
name = "X"
parent = "Y"
side = "table"
type = "linear"
axis = [-1, 0, 0]
range = [-380, 380]
rapid = 52000
max_feed = 52000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.joint]]
name = "Z"
