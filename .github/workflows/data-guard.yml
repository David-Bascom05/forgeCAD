# Licence guard: no file of the Fusion 360 Gallery Dataset may ever be committed (its licence is
# non-commercial research only, no redistribution). tools/ci/no-fusion-gallery.py; a few seconds.
name: data-guard

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fusion-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/ci/no-fusion-gallery.py

  # The makers' Autodesk-hosted tool libraries: used from a git-ignored cache, never committed
  # (tools/fetch-tool-libraries.sh, research/cam/tooling/libraries.md).
  vendor-tool-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/ci/no-vendor-tool-libraries.py
