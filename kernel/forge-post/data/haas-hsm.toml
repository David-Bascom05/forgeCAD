# Haas NGC-style milling WITH the high-speed machining option (the haas dialect plus G187) (Fanuc-family ISO with Haas codes): restated from public RS274/NGC practice (NIST IR 6556) and
# common Fanuc conventions; facts only, no vendor post copied. Verify with your control's manual.
[dialect]
name = "haas-hsm"
extension = "nc"
decimals = 3
feed_decimals = 1
units_mm = "G21"
units_inch = "G20"
inch_decimals = 4
inch_feed_decimals = 2
point = "always"          # always: X10. ; never: X10 ; full: X10.000
program_open = ["%", "O{num:04} ({title})"]
program_close = ["M30", "%"]
comment = "({text})"
comment_strip = "()"
line_numbers = true
line_start = 10
line_step = 10
# G187 P2 (smoothness, documented under the high-speed machining option): for Haas machines
# with that option. The P1/P2/P3 = rough/medium/finish mapping is not confirmed by the sources
# at hand (research/cam/machines/haas-dialect-audit.md #7); P2 = the medium default of setting 191
safe_start = ["G90 G94 G17 G49 G40 G80", "{units}", "G187 P2"]
tool_change = ["T{t} M06"]
length_comp = "G43 H{h}"
spindle_cw = "S{rpm} M03"
spindle_ccw = "S{rpm} M04"
spindle_stop = "M05"
wcs = "G{n}"             # n = 54..59
wcs_first = 54
wcs_count = 6
arc = "ijk"
retract_home = ["G91 G28 Z0.", "G90"]
coolant_flood = "M08"
# no coolant_mist: no Haas M-code list shows M07 (HFO Mill Programming manual rev 04-2014: M08/M09,
# M88/M89, M83/M84; Gerotech NGC training: M73/M74 tool air blast, M83/M84 auto air gun), so mist
# is refused rather than posted as an unsupported code (research/cam/machines/haas-dialect-audit.md)
coolant_through = "M88"
coolant_through_off = "M89"
coolant_off = "M09"
dwell = "G04 P{ms}"      # milliseconds
cycle_drill = "G98 G81 X{x} Y{y} Z{z} R{r} F{f}"
cycle_dwell = "G98 G82 X{x} Y{y} Z{z} R{r} P{ms} F{f}"
cycle_peck = "G98 G83 X{x} Y{y} Z{z} R{r} Q{q} F{f}"
cycle_chipbreak = "G98 G73 X{x} Y{y} Z{z} R{r} Q{q} F{f}"
cycle_tap = "G98 G84 X{x} Y{y} Z{z} R{r} F{f}"
cycle_ream = "G98 G85 X{x} Y{y} Z{z} R{r} F{f}"
cycle_next = "X{x} Y{y}"
cycle_cancel = "G80"
# probing: Renishaw Inspection Plus for Haas machining centres (H-2000-6222-0A-B), the edition
# Haas publishes for its controls. Only these four macros are written; every other probing
# record is refused. O9811's Q is always written (its 4 mm / 10 mm defaults are not relied on).
probe_on = "G65 P9832"
probe_off = "G65 P9833"
probe_protected = "G65 P9810 X{x} Y{y} Z{z} F{f}"
probe_surface = "G65 P9811 {axis}{at} Q{q}{set}"
source = "forgecad, restated from NIST RS274NGC v3 and common Fanuc practice"
taken = "2026-11-23"
note = "verify with your control's manual"

[[dialect.cite]]
key = "probe_on"
source = "https://haascnc.com/content/dam/haascnc/en/service/reference/probe/renishaw-inspection-plus-programming-manual---2008.pdf (Renishaw, Inspection Plus software for Haas machining centres, programming manual H-2000-6222-0A-B (2008), published by Haas)"
taken = "2026-11-24"
where = "chapter 9, Turning the probe on - macro O9832"
note = "format G65P9832; turns the probe on (includes M19); a small automatic Z axis movement takes place within the macro to test the probe; the probe tool offset must be active (read by PROBING, 2026-11-24)"

[[dialect.cite]]
key = "probe_off"
source = "https://haascnc.com/content/dam/haascnc/en/service/reference/probe/renishaw-inspection-plus-programming-manual---2008.pdf (Renishaw, Inspection Plus software for Haas machining centres, programming manual H-2000-6222-0A-B (2008), published by Haas)"
taken = "2026-11-24"
where = "chapter 9, Turning the probe off - macro O9833"
note = "format G65P9833; a small automatic Z axis movement takes place within the macro; a G28 reference return must follow it (read by PROBING, 2026-11-24)"

[[dialect.cite]]
key = "probe_protected"
source = "https://haascnc.com/content/dam/haascnc/en/service/reference/probe/renishaw-inspection-plus-programming-manual---2008.pdf (Renishaw, Inspection Plus software for Haas machining centres, programming manual H-2000-6222-0A-B (2008), published by Haas)"
taken = "2026-11-24"
where = "chapter 5, Protected positioning - macro O9810"
note = "format G65 P9810 Xx Yy Zz [Ff Mm]; X Y Z the target positions; F the modal feedrate of protected positioning moves (example G65P9810Z-8.F3000); the machine stops with alarm PATH OBSTRUCTED if the probe triggers (read by PROBING, 2026-11-24)"

[[dialect.cite]]
key = "probe_surface"
source = "https://haascnc.com/content/dam/haascnc/en/service/reference/probe/renishaw-inspection-plus-programming-manual---2008.pdf (Renishaw, Inspection Plus software for Haas machining centres, programming manual H-2000-6222-0A-B (2008), published by Haas)"
taken = "2026-11-24"
where = "chapter 7, X Y Z single surface measurement - macro O9811"
note = "format G65 P9811 Xx or Yy or Zz [Ee Ff Hh Mm Qq Ss Tt Uu Vv Ww]; the cycle measures the surface and returns to the start position; Q the overtravel past the expected position (defaults 4 mm in Z, 10 mm in X,Y); S1 to S6 the work offset G54 to G59 set (new offset = active offset + error) (read by PROBING, 2026-11-24)"

