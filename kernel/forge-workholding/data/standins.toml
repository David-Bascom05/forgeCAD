# Stand-ins: a class of device for which no maker publishes the sizes a collision body needs
# (jaw thickness, base sizes, step increments, ...). Each is `standin = true` with its `basis`:
# which published values it follows and which numbers are ours. Prefer a real product's record
# (products.toml), giving it the sizes you measure; use a stand-in only to plan before measuring.
# Units mm (kPa for vacuum).

[[workholding]]
name = "standin-vise-150"
kind = "vise"
standin = true
basis = "a stand-in for the 6 in (150 mm) jaw class of machine vise: jaw width, jaw depth, opening and height rounded from the published Kurt DX6 (kurt-dx6: 152.4 / 44.07 / 230.6 / 117.1); jaw thickness and base sizes are ours (no maker publishes them): measure your vise"
jaw_width = 150
jaw_height = 50
jaw_thickness = 20
max_opening = 160
body_length = 400
body_width = 150
height = 100
[[workholding.part]]
body = "base"
file = "standin-vise-150/base.fg"
[[workholding.part]]
body = "fixed jaw"
file = "standin-vise-150/jaw.fg"
[[workholding.part]]
body = "moving jaw"
file = "standin-vise-150/jaw.fg"

[[workholding]]
name = "standin-centring-vise-80"
kind = "self_centring"
standin = true
basis = "a stand-in for the small 5-axis self-centring vise class: sizes rounded between LANG Makro-Grip 77 (130 x 77 x 65) and 5th Axis V75100X (100 x 75 x 56); jaw height and thickness ours (not published)"
jaw_width = 80
jaw_height = 20
jaw_thickness = 15
max_opening = 120
min_opening = 10
body_length = 160
body_width = 80
height = 70
grip = 4

[[workholding]]
name = "standin-dovetail-60"
kind = "dovetail"
standin = true
