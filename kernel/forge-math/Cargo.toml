[package]
name = "forge-math"
description = "Deterministic numeric core for the ForgeCAD kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# the exact numbers (Big, Dy) the dyadic geometry in exact.rs is built on
forge-num = { path = "../forge-num" }
# the scoped threads every parallel path runs on (a host's spawner where std has none)
forge-par = { path = "../forge-par" }

[target.'cfg(target_family = "wasm")'.dependencies]
forge-alloc = { path = "../forge-alloc" }

[lints]
workspace = true
