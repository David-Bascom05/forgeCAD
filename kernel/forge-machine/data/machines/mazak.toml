# Mazak VCN-530C-L: 40-taper VMC, MAZATROL SmoothG. X 1050 Y 530 Z 510, table 1300 x 550,
# 12000 rpm BT40, 30 tools.
[[machine]]
name = "mazak-vcn-530c-l"
kind = "vmc3"
control = "mazak-eia"
length_joint = "Z"
coolants = ["flood"]
clearance = 1
source = "https://www.mazak.com/my-en/detail/china/vertical/lg-vn530cel/ | https://mazak.com/id-en/products/vcn"
taken = "2026-11-23"
note = "the China-built VCN-530C L: the only VCN-530C page Mazak still publishes (the 530C/530C HS are no longer listed); architecture assumed: fixed column, X table on a Y saddle (Mazak's page does not say: UNKNOWN); spindle centre to column UNKNOWN: put at the least that clears the table at full Y (estimate); spindle power published as ratings only (25% ED 18.5 kW, cont 7.5 kW): no curve, no power check; tool change time UNKNOWN; an unpublished required field takes the value that makes its check vacuous (rapid high, max feed = rapid, change time 0.001 s, tool weight 99 kg), named UNKNOWN beside it; overall 2950 x 2973 x 2808, 6800 kg; joint 0 = mid-travel for X and Y and the top of travel for Z; the control's machine zero is at a travel end (which: UNKNOWN), so a real G54 differs by a constant per axis; bodies are single boxes/cylinders from published overall sizes; head, column, saddle, bed and turret sizes are estimates, the spindle housing radius kept large; the enclosure is not modelled; the control also runs MAZATROL conversational; posted EIA/ISO G-code is the dialect (mazak-eia: not in forge-post yet)."
real = true

[[machine.joint]]
name = "Y"
parent = "base"
side = "table"
type = "linear"
axis = [0, -1, 0]
range = [-265, 265]
rapid = 42000
max_feed = 42000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.joint]]
name = "X"
parent = "Y"
side = "table"
type = "linear"
axis = [-1, 0, 0]
range = [-525, 525]
rapid = 42000
max_feed = 42000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.joint]]
