path = "joint.B.pivot"
status = "estimate"
source = "tools/machines/spinner_u5_620_fit.py on Zenodo 15735480 data_v1_0_1.csv (RPTU/Spinner dataset log, CC BY 4.0; sha256 d7227bad...be580 as fetched 2026-11-24)"
taken = "2026-11-24"
value = "the B axis 49.3 mm above the table top, through the C axis; +B and +C turn the table negatively (axes [0,-1,0], [0,0,-1])"
basis = "fitted from logs, not published: under TRAORI the log's MCS = R_B R_C BCS + t; per (tool, B, C) group a Kabsch fit (residual median 0.009-0.066 mm in the 4 clean groups, 8 groups mixing states dropped) gives every rotation as R_y(-B) R_z(-C) (within 0.0021; the + senses miss by 2.0); one least-squares fit of the offsets gives b_x + b_z = 49.475 and the C axis at (0.183, 0.088) in machine coordinates (rms 0.142, max 0.333 mm). Only B 0 and 90 occur under TRAORI, so where on the line b_x + b_z = 49.475 the B axis lies is not separable from the (unpublished) tool lengths: B and C are taken as intersecting (b_x = c_x), an assumption, giving b_z = 49.29; the table top is taken at machine Z 0 (the log's Z 152.6..610 matches Asset-Trade's 'spindle nose to table 150-610'), an estimate. Implied gauge lengths 137.0 (ENTFRAESER_D8_N_90GRAD) and 250.1 mm (SCHAFT_D12_N_AP30)"

