# The workspace's tests as wasm32-wasip1 under Node's WASI (tools/test-wasm.sh): the same
# arithmetic as the browser, so a result that rounds differently there fails here. The Forgejo
# CI runs the same script (its gate job). Debug info is off: with it the test binaries come to
# tens of GB.
name: wasm

# No push trigger: pull requests merge with current main in their head, so this ran on the tree
# that lands, and its build cache holds no third-party crates (nothing for main to warm). A manual
# run (workflow_dispatch) runs it on main.
on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that pull request's runs still queued or running for its
# older commits; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml, with wasm32-wasip1)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test (wasm32-wasip1)
        run: sh tools/test-wasm.sh
