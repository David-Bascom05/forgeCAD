name = "splineloops"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SplineLoops", "SplineSpec", "splineoracle"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "SplineLoops"

# The specification of .fg's splines (research/spline-spec): core-only definitions, the
# Mathlib theorems about them, and the oracle the Rust is checked against.
[[lean_lib]]
name = "SplineSpec"

[[lean_exe]]
name = "splineoracle"
root = "SplineSpec.Oracle"
