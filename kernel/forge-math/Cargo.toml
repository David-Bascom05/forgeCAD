[package]
name = "forge-math"
description = "Deterministic numeric core for the ForgeCAD kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# the scoped threads every parallel path runs on (a host's spawner where std has none)
forge-par = { path = "../forge-par" }

[features]
# tests only: map_adaptive starts its helpers at once (par::force_helpers); never in a shipped build
force_helpers = []

[target.'cfg(target_family = "wasm")'.dependencies]
forge-alloc = { path = "../forge-alloc" }

[lints]
workspace = true
