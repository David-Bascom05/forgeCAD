# Tool-life data: Taylor's equation v T^n f^a ap^b = C per tool material/coating × work material.
# Every row cites its published source (source, taken = table/equation/page, value = the source's
# own statement). A tool × material with no row is "not estimated": no number is guessed.
# Units: v m/min, T min, f per `feed` (fz | hex | hm mm, f mm/rev), ap mm.
# Schema: research/cam/toollife/model.md.

# ---- Ti-6Al-4V, coated carbide, milling ----------------------------------------------------
[[life]]
id = "ti64-carbide-alti-n-highfeed-vb03"
op = "milling"
tool = "carbide"
coating = "AlTiN"
work = ["Ti-6Al-4V annealed"]
condition = "the source names Ti6Al4V without its heat treatment or hardness; matched to forge-material's Ti-6Al-4V annealed by grade"
group = "S"
n = 0.336
c = 204.4
feed = "fz"
vb = 0.3
criterion = "average flank wear VB = 0.3 mm"
vc_range = [50, 125]
source = "Albertelli, Mussi, Strano, Monno, 'Experimental investigation of the effects of cryogenic cooling on tool life in Ti6Al4V milling', Int J Adv Manuf Technol (2021), doi:10.1007/s00170-021-07161-9"
taken = "Eq. 5 (ln TL = b0 + b1 ln vc), conventional (flood) cooling, VB 0.3 mm fit; n = -1/b1, C = exp(-b0/b1)"
value = "b0 = 15.827, b1 = -2.975 (n = 0.336, C = 204.4 derived)"
licence = "CC BY 4.0"
note = "Mitsubishi JOMT06T216ZZER-JL MP9140 (PVD Al-rich (Al,Ti)N) high-feed cutter D20 Z3, down milling, ap 0.4, ae 13, fz 0.7. Narrow fit: a high-feed geometry; extrapolating to end mills is outside the data."

