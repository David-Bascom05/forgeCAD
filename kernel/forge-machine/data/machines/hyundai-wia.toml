# Hyundai WIA KF5600: KF5600 series.
# X 1100 Y 560 Z 520; 8000 rpm BBT40; 30 tools.
[[machine]]
name = "hyundai-wia-kf5600"
kind = "vmc3"
control = "unknown"
length_joint = "Z"
coolants = ["flood"]
clearance = 1
source = "https://www.komachine.com/en/companies/hyundai-wia/products/38038"
taken = "2026-11-23"
note = "architecture assumed: X table on a Y saddle, Z head on a fixed column (the maker's page does not say which unit carries which: UNKNOWN unless stated above); spindle centre to column UNKNOWN: put at the least that clears the table at full Y (estimate); spindle nose to table UNKNOWN: 150 to 150 + Z (estimate); spindle power as published: cont 11 kW; peak/other 15 kW; torque cont 143 N.m; torque max 286 N.m (no curve: no power check); max tool length UNKNOWN: 1000 (no check); max tool diameter UNKNOWN: 500 (no check); numbers from a page hosted by a dealer/importer/marketplace (https://www.komachine.com/en/companies/hyundai-wia/products/38038), not the maker's own site; an unpublished required field takes the value that makes its check vacuous (rapid high, max feed = rapid, change time 0.001 s, tool weight 99 kg), named UNKNOWN beside it; joint 0 = mid-travel for X and Y and the top of travel for Z; the control's machine zero is at a travel end (which: UNKNOWN), so a real G54 differs by a constant per axis; bodies are single boxes/cylinders from published overall sizes; head, column, saddle, bed and turret sizes are estimates, the spindle housing radius kept large; the enclosure is not modelled; control UNKNOWN (not published)."

[[machine.joint]]
name = "Y"
parent = "base"
side = "table"
type = "linear"
axis = [0, -1, 0]
range = [-280, 280]
rapid = 40000
max_feed = 40000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.joint]]
name = "X"
parent = "Y"
side = "table"
type = "linear"
axis = [-1, 0, 0]
range = [-550, 550]
rapid = 40000
max_feed = 40000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.joint]]
name = "Z"
parent = "base"
side = "head"
type = "linear"
axis = [0, 0, 1]
range = [-520, 0]
rapid = 36000
max_feed = 36000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.spindle]]
name = "S1"
link = "Z"
kind = "milling"
axis = [0, 0, 1]
nose = [0, 0, 670]
rpm = [1, 8000]   # rpm min UNKNOWN (unpublished): 1 = no lower check
max = [1000, 500]
interface = "BBT40"

[[machine.changer]]
pockets = 30
change_s = 3.2   # chip to chip, published
max_tool_kg = 99   # UNKNOWN (unpublished): no weight check

[[machine.mount]]
name = "spindle"
kind = "tool"
link = "Z"
at = [0, 0, 670]
dir = [0, 0, -1]

[[machine.mount]]
name = "table"
kind = "part"
link = "X"
at = [0, 0, 0]
dir = [0, 0, 1]
xdir = [1, 0, 0]

[[machine.body]]
name = "bed"
link = "base"
part = "parts/hyundai-wia/wia-kf5600/bed.fg"
ignore = ["saddle", "column"]
[[machine.body.box]]
min = [-625, -660, -700]
max = [625, 1070, -400]

