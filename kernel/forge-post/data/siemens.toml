where = "G21 3.2.2 p. 3-60; G90 3.2.1 p. 3-59; G94 1.2.4 p. 1-21; G17 p. 2-27; G40 3.5.3 p. 3-76; G49 3.5.2 p. 3-74; G80 4.1.14 p. 4-127"
