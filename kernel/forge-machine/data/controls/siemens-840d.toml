# SINUMERIK 840D sl in its native language (not the ISO dialect, forge-post's `siemens`): read by
# forge-machine's shell only (forge-post does not write it). The subset is what NX's 840D post
# writes for the Spinner U5-620 programs of the open dataset ElMoe/Production-Data-Set-for-Five-
# Axis-CNC-Milling-with-Multiple-Changeovers; everything else is refused, naming the construct.
# Restated from Siemens' openly published manuals (cache.industry.siemens.com):
#   PGsl  SINUMERIK 840D sl / 828D Fundamentals, Programming Manual 03/2013, 6FC5398-1BP40-3BA1
#   PGAsl SINUMERIK 840D sl / 828D Job Planning, Programming Manual 03/2013, 6FC5398-2BP40-3BA1
#   PGZ   SINUMERIK 840D sl/840D/840Di/810D Cycles, Programming Manual 11/2006, 6FC5398-3BP20-0BA0
[dialect]
name = "siemens-840d"
native = "840d"
# the programs write at most 4 decimals (CYCLE81's depth); the control's own input resolution is
# machine data (not applied here)
decimals = 4
feed_decimals = 3
dwell = "G4 F{s}"

[[dialect.cite]]
key = "native"
source = "https://cache.industry.siemens.com/dl/files/554/74475554/att_56792/v1/PGsl_0313_en_en-US.pdf"
taken = "2026-11-24"
where = "PGsl: G0 9.4 p186, G1 9.5 p190, G2/G3 with I J K 9.6.2 p196, helix TURN 9.7 p211, G17 8.2 p153, G90 8.3.1 p156, G710 8.3.5 p165, G94 7.1 p101, G60/G601 exact stop 11.1 p305, SUPA 8.1 p149 and 12.9 p354, tool change T=\"name\" M6 T0 4.2.2 pp58-59, D0/D<n> 5.6 p73, MSG 14.1 p367, G4 F 14.7 p386"
note = "SUPA suppresses frames (zero offsets), not the tool offset; a D's length acts on the next traverse of the length axis; without a D after M6 the length is machine data"

[[dialect.cite]]
key = "native"
source = "https://cache.industry.siemens.com/dl/files/038/70265038/att_80019/v1/PGAsl_0313_en_en-US.pdf"
taken = "2026-11-24"
