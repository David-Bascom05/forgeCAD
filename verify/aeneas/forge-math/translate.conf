# kernel/forge-math: the sign predicates (the L4 pilot)
PKG=ForgeMath
# two_sum, two_diff and split are forge-num's (forge_num::shewchuk, forge-math's text moved);
# two_product here is the wrapper that keeps the debug-build precondition check
DEPS=(forge-num)
CHARON_ARGS=(
  --start-from forge_math::predicates::two_product
  --start-from forge_math::predicates::cross_sign
  --start-from forge_math::predicates::orient2d
  --start-from forge_math::predicates::dot3
  --start-from forge_math::predicates::incircle
  --start-from forge_math::vec                     # Point2/3, Vec2/3 (forge-geom, forge-bool)
  --start-from forge_math::frame                   # rigid frames
  --start-from forge_math::interval                # Interval, Box3
  --start-from forge_math::tol                     # the tolerances
  --start-from forge_math::dmath                   # deterministic math (ieee's Dmath models)
)
# Opaque (see verify/aeneas/forge-math/README.md for why, and what makes each translatable):
CHARON_ARGS+=(
  --opaque forge_math::predicates::cross_big       # the Big fallback (iterator chains, u128)
  --opaque forge_math::predicates::orient2d_big
  --opaque forge_math::predicates::dot3_big
  --opaque forge_math::predicates::incircle_big
  --opaque forge_math::predicates::exact_diffs     # iter_mut().zip(..): no `zip`
  --opaque forge_math::predicates::incircle        # iter().all(..) in stage B: no `all`
  --opaque forge_math::predicates::incircle_exact_general   # a local named `lift` shadows Aeneas's `lift`
)
