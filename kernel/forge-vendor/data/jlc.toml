# JLCCNC sheet metal (JLC), restated from its public help and capability pages (read 2026-11-23).
# Not an official profile and not endorsed by JLC. Verify with the vendor before ordering.
# PARTIAL: JLCCNC publishes no K-factor, bend deduction or inside radius for its own process (only
# an "outer R corner radius" per thickness, kept as each stock's note); a bent sheet gives r: and
# bend: itself. Sources and choices: research/sheet-metal/vendors/jlc.md
format = 1
id = "jlc"
name = "JLCCNC sheet metal (JLC)"
source = "https://jlccnc.com/help/article/sheet-metal-fabrication-guidelines ; https://jlccnc.com/capabilities/sheet-metal-fabrication ; https://jlccnc.com/help/article/materials-supported-in-sheet-metal-fabrication ; https://jlccnc.com/help/article/sheet-metal-fasteners-chart"
taken = "2026-11-23"
units = "mm"
note = "Partial: minimum bending edge and hole to bending edge per thickness (the guidelines' Bending Design Constraints table), minimum hole and hole spacing, tolerances, materials and thicknesses, press-in hardware. No K or inside radius published. Maximum part length 800 mm (no width stated, so not checked). Not official. Verify with the vendor before ordering."
operations = ["laser", "punch", "bend", "hem", "tap", "countersink", "hardware", "powder_coat"]

[tolerance]
general = "+/-0.2 mm"
cut = "+/-0.1 mm"
bend = "+/-0.3 mm"
bend_angle = "+/-1.0 deg (the guidelines print +1.0 deg)"
punch = "+/-0.1 mm"
hole_diameter = "+/-0.1 mm"
thread = "+/-0.1 mm"

[rules]
min_hole = "max(0.5t, 1)"
min_web = 1                  # minimum distance between holes

[[material]]
name = "5052 aluminum"
aliases = ["5052", "AL5052", "aluminum 5052"]
note = "Temper not stated by JLCCNC: no library material is named, so the part has no mass from it."

[[material.stock]]
t = 0.5
min_flange = 3.5   # minimum bending edge, single bend
hole_to_bend = 2.6   # round hole edge to bending edge
note = "outer R corner radius 1.2 mm; second bend 4.5 mm, square hole to bending edge 3.5 mm"

[[material.stock]]
t = 0.8
min_flange = 3.8   # minimum bending edge, single bend
hole_to_bend = 3.3   # round hole edge to bending edge
