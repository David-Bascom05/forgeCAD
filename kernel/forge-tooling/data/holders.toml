# Generic holders, labelled conservative: envelopes larger than typical, so a pass here is
# safe for a typical holder of the interface. Our own round numbers, not any maker's drawing.

[[holder]]
id = "bt40-er32"
interface = "BT40"
clamp = "er32"
gauge_length = 70.0
profile = [[0, 50.0], [22, 50.0], [28, 44.0], [70, 44.0]]
max_rpm = 15000
source = "forgecad generic, conservative envelope"
note = "generic, conservative; verify with the vendor"

