# Centroid CNC12 (mill): restated from the CNC12 v4.12 mill operator's manual (centroidcnc.com);
# every code is cited below. Parentheses are expressions on this control, not comments: comments
# are ; to the end of the line. G0 moves Z first going up (a dog-leg): simulate with dogleg = true.
[dialect]
name = "centroid-cnc12"
extension = "nc"
decimals = 4
feed_decimals = 1
units_mm = "G21"
units_inch = "G20"
inch_decimals = 4
inch_feed_decimals = 2
point = "always"
program_open = ["; {title}"]
program_close = ["M30"]
comment = "; {text}"
comment_eol = ";"
comment_strip = ";()[]"
line_numbers = false
safe_start = ["G17 {units} G40 G49 G80 G90 G94"]
tool_change = ["T{t} M6"]
length_comp = "G43 H{h}"
spindle_cw = "S{rpm} M3"
spindle_ccw = "S{rpm} M4"
spindle_stop = "M5"
wcs = "G{n}"
wcs_first = 54
wcs_count = 6
arc = "ijk"
retract_home = ["G91 G28 Z0.", "G90"]
coolant_flood = "M8"
coolant_mist = "M7"
coolant_off = "M9"
dwell = "G4 P{s}"
cycle_drill = "G98 G81 X{x} Y{y} Z{z} R{r} F{f}"
cycle_dwell = "G98 G82 X{x} Y{y} Z{z} R{r} P{s} F{f}"
cycle_peck = "expand"
cycle_chipbreak = "expand"
cycle_tap = "G98 G84 X{x} Y{y} Z{z} R{r} F{f}"
cycle_ream = "G98 G85 X{x} Y{y} Z{z} R{r} F{f}"
cycle_next = "X{x} Y{y}"
cycle_cancel = "G80"
source = "Centroid CNC12 v4.12 mill operator's manual (cited per code)"
taken = "2026-11-23"
note = "M30 does nothing unless customised (Intercon posts it); M2 would restart the program, so it is never written"
cite_required = true

[[dialect.cite]]
key = "program_open"
source = "https://www.centroidcnc.com/centroid_diy/downloads/CNC12-v412_operator_manuals/centroid-cnc12-oak-allin1dc-mill-operator-manual-v4.12.pdf"
taken = "2026-11-23"
where = "Centroid M-Series Operator's Manual, CNC12 (Oak/Allin1DC mill), chapters 11-13, CNC12 Version 4.12, (c) 2018; 11.2.6 O - Program Number p192"
note = "no start code; a ; comment names the program"

