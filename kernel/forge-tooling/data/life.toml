# ---- AISI 1045, coated carbide, turning -----------------------------------------------------
[[life]]
id = "1045-carbide-cvd-turning"
op = "turning"
tool = "carbide"
coating = "TiCN-Al2O3-TiN"
work = ["AISI 1045 168-190 HB"]
group = "P"
n = 0.362
c = 1085
feed = "f"
vb = 0.3
criterion = "flank wear VB = 0.3 mm"
vc_range = [300, 400]
source = "Abeni, Attanasio, Outeiro, Poulachon, 'A novel procedure to predict cumulative tool wear in turning based on experimental analysis', Wear 560-561 (2025) 205607, doi:10.1016/j.wear.2024.205607"
taken = "Section 4.2.2"
value = "n = 0.362, C = 1085"
licence = "Elsevier, all rights reserved (coefficients cited as facts; free author copy at iris.unibs.it)"
note = "Sandvik VBMT 160404 PM4325, ap 1, f 0.1 mm/rev, wet, 168-190 HB. Same group's Procedia CIRP 2025 paper finds linear (Miner-type) accumulation within ~10% under variable speed for this pair."
