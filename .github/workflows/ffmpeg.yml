# The LGPL ffmpeg ForgeCAD records video with (research/render/record.md), built from the sources
# tools/ffmpeg/PIN pins and published as release assets of this repository (tag
# ffmpeg-<version>-<build>), which tools/fetch-ffmpeg.sh / .ps1 and the installers fetch.
# Never per push: by hand (workflow_dispatch), or on main when tools/ffmpeg/PIN changes (a version
# or BUILD bump). Its summary lists each asset's sha256 for PIN's ASSET_* lines.
name: ffmpeg

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/ffmpeg/PIN]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: macos-arm64
            os: macos-14
          - platform: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ matrix.platform == 'windows-x86_64' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - name: tools (Linux)
        if: matrix.platform == 'linux-x86_64'
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm pkg-config zlib1g-dev
      - name: tools (macOS)
        if: matrix.platform == 'macos-arm64'
        run: brew install nasm pkg-config
      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows-x86_64'
        with:
          msystem: MINGW64
          install: >-
            make curl tar xz p7zip
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: build
        run: sh tools/ffmpeg/build.sh ${{ matrix.platform }} out
      - name: check it is LGPL and records H.264
        run: |
          mkdir -p unpacked
          for a in out/*; do case "$a" in *.zip) 7z x -ounpacked "$a" >/dev/null ;; *) tar xJf "$a" -C unpacked ;; esac; done
          f=$(ls unpacked/*/bin/ffmpeg unpacked/*/bin/ffmpeg.exe 2>/dev/null | head -1)
          test -n "$f"
          "$f" -hide_banner -buildconf | grep -q -- '--disable-gpl'
          ! "$f" -hide_banner -buildconf | grep -q -- '--enable-gpl'
          "$f" -hide_banner -encoders | grep -q libopenh264
      - name: sha256
        run: (cd out && (sha256sum * 2>/dev/null || shasum -a 256 *)) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: out/*
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/ffmpeg/PIN
          tag="ffmpeg-$FFMPEG_VERSION-$BUILD"
          notes="ffmpeg $FFMPEG_VERSION (LGPL) with OpenH264 $OPENH264_VERSION, built by .github/workflows/ffmpeg.yml from $FFMPEG_URL and $OPENH264_URL; each archive holds the licences and THIRD-PARTY.md with the configure line."
          gh release create "$tag" assets/* --title "$tag" --notes "$notes" || gh release upload "$tag" assets/* --clobber
          (cd assets && sha256sum *) | tee -a "$GITHUB_STEP_SUMMARY"
