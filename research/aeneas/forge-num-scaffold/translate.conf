# kernel/forge-num: the shared exact numeric core (EXACT-CORE). Nat, Big, Dy, Ctx, Ival, and later
# the Shewchuk helpers. forge-math (and later forge-sheet-core) take it under DEPS.
PKG=ForgeNum
# Dy and Ival use f64, so the float bridge stays (no BRIDGE=none).
# The roots: fill in the modules as they land in kernel/forge-num (start small: one module per step,
# Charon needs memory in proportion to what it reaches).
CHARON_ARGS=(
  --start-from forge_num::nat
  --start-from forge_num::big
)
# Opaque: what Aeneas cannot take, kept as the fastest Rust (David: speed over translatability). Each
# is an open L4 gap, defined in lean/ForgeNum/FunsExternal.lean as a Lean `opaque` (never an axiom).
CHARON_ARGS+=(
)
