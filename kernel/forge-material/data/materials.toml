# ForgeCAD engineering materials library.
# Mass comes from density; the other keys feed stress/thermal checks.
#
# Keys and units:
#   name      canonical name a user types          aliases  other spellings
#   family    steel | stainless | aluminium | copper | iron | titanium | plastic | rubber | wood
#   density   kg/m^3 (required)                    youngs   Young's modulus, GPa
#   poisson   Poisson's ratio (dimensionless)      yield    tensile yield, MPa (0.2% offset unless noted)
#   uts       ultimate tensile / tensile strength at break, MPa
#   cte       linear thermal expansion, 1e-6/K, about 20-100 C unless the note says otherwise
#   colour    sRGB hex rendering colour (appearance only, not sourced)
#   source    reference covering every value in the record; source_<key> overrides it for one value
#   note      condition/temper, test basis, typical vs minimum, and why any key is left out
#
# Every number is taken from (or converted from US units out of) the cited source.
# A key is absent when it does not apply or no source could be verified; the note says which.
# Values are typical unless the note says minimum; they are not design allowables.

