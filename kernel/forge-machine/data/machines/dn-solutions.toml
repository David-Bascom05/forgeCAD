# DN Solutions (formerly Doosan Machine Tools) machines: the maker's published specifications, restated (never copied); each record's
# `source` is the page or catalogue read and `taken` the date. Estimates and UNKNOWNs are named in
# each record's `note` and beside the field. Bodies are conservative envelopes from published
# overall dimensions, not the maker's CAD. Format: docs/cam-machine.md.

# ---------------------------------------------------------------------------------------------
# DN Solutions DNM 4500: DNM 4th generation (DNM 4500/5700/6700), DN Solutions Fanuc i Plus.
# X 800 Y 450 Z 510; 8000 rpm ISO #40 (BT40 standard; CAT40/DIN40 optional; BIG PLUS options); 30 tool
[[machine]]
name = "dn-solutions-dnm-4500"
kind = "vmc3"
control = "fanuc"
length_joint = "Z"
coolants = ["flood"]
clearance = 1
source = "https://www.dn-solutions.com/us/product/machining-center/vertical/dnm-4500-4th.do | https://images.machineryhouse.com.au/products/M8415/PDF/DNM%20Series%20_4th%20Gen._%20_7__1731027798.pdf"
taken = "2026-11-23"
note = "architecture assumed: X table on a Y saddle, Z head on a fixed column (the maker's page does not say which unit carries which: UNKNOWN unless stated above); spindle centre to column UNKNOWN: put at the least that clears the table at full Y (estimate); spindle power as published: cont 11 kW; peak/other 18.5 kW; torque max 117.8 N.m (no curve: no power check); max tool diameter 80 with the neighbouring pockets full, 125 with them empty; magazine options: 40, 60; some numbers from https://images.machineryhouse.com.au/products/M8415/PDF/DNM%20Series%20_4th%20Gen._%20_7__1731027798.pdf (not the maker's own site): see the research file; overall 2835 x 2200 x 2980; machine 5000 kg; an unpublished required field takes the value that makes its check vacuous (rapid high, max feed = rapid, change time 0.001 s, tool weight 99 kg), named UNKNOWN beside it; joint 0 = mid-travel for X and Y and the top of travel for Z; the control's machine zero is at a travel end (which: UNKNOWN), so a real G54 differs by a constant per axis; bodies are single boxes/cylinders from published overall sizes; head, column, saddle, bed and turret sizes are estimates, the spindle housing radius kept large; the enclosure is not modelled."
real = true

[[machine.joint]]
name = "Y"
parent = "base"
side = "table"
type = "linear"
axis = [0, -1, 0]
range = [-225, 225]
rapid = 42000
max_feed = 42000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.joint]]
name = "X"
parent = "Y"
side = "table"
type = "linear"
axis = [-1, 0, 0]
range = [-400, 400]
rapid = 42000
max_feed = 42000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.joint]]
name = "Z"
parent = "base"
side = "head"
type = "linear"
axis = [0, 0, 1]
range = [-510, 0]
rapid = 36000
max_feed = 36000   # max cutting feed UNKNOWN (unpublished): = rapid, no feed clamp

[[machine.spindle]]
name = "S1"
link = "Z"
kind = "milling"
axis = [0, 0, 1]
nose = [0, 0, 660]
rpm = [1, 8000]   # rpm min UNKNOWN (unpublished): 1 = no lower check
max = [300, 80]
interface = "ISO #40 (BT40 standard; CAT40/DIN40 optional; BIG PLUS optio"

[[machine.changer]]
pockets = 30
change_s = 4.1   # chip to chip, published (tool to tool 1.2)
max_tool_kg = 8

[[machine.mount]]
name = "spindle"
kind = "tool"
link = "Z"
at = [0, 0, 660]
dir = [0, 0, -1]

[[machine.mount]]
name = "table"
kind = "part"
link = "X"
at = [0, 0, 0]
dir = [0, 0, 1]
xdir = [1, 0, 0]

[[machine.body]]
name = "bed"
link = "base"
part = "parts/dn-solutions/dn-solutions-dnm-4500/bed.fg"
ignore = ["saddle", "column"]
[[machine.body.box]]
min = [-500, -550, -700]
max = [500, 960, -400]

[[machine.body]]
name = "column"
link = "base"
part = "parts/dn-solutions/dn-solutions-dnm-4500/column.fg"
ignore = ["bed", "head"]
[[machine.body.box]]
min = [-300, 510, -400]
max = [300, 960, 1310]

[[machine.body]]
name = "saddle"
link = "Y"
part = "parts/dn-solutions/dn-solutions-dnm-4500/saddle.fg"
ignore = ["bed", "table"]
[[machine.body.box]]
min = [-400, -225, -250]
max = [400, 225, -100]

[[machine.body]]
name = "table"
link = "X"
part = "parts/dn-solutions/dn-solutions-dnm-4500/table.fg"
ignore = ["saddle"]
[[machine.body.box]]
min = [-500, -225, -100]
max = [500, 225, 0]

[[machine.body]]
name = "nose"
link = "Z"
part = "parts/dn-solutions/dn-solutions-dnm-4500/nose.fg"
ignore = ["column"]
[[machine.body.cyl]]
base = [0, 0, 660]
axis = [0, 0, 1]
r = 110
h = 150

[[machine.body]]
name = "head"
link = "Z"
part = "parts/dn-solutions/dn-solutions-dnm-4500/head.fg"
ignore = ["column"]
[[machine.body.box]]
min = [-140, -140, 810]
max = [140, 510, 1260]

