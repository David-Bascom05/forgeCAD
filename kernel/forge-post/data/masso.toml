key = "program_open"
source = "https://docs.masso.com.au/supported-g-codes/comments"
taken = "2026-11-23"
where = "MASSO Documentation: ( ) - Comments, web page, 'Last updated 5 October 2026'; whole page"
note = "a ( ) comment names the program"

