name = "tess"
version = "0.1.0"
defaultTargets = ["Tess"]

# The tessellation's L1 spec and its L3 lemmas (research/tessellation-proof). Mathlib at the pin
# verify/forge-mesh-check uses, so the two can be one package.
[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "Tess"
