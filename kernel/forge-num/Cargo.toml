[package]
name = "forge-num"
description = "ForgeCAD's shared numeric core, written for Aeneas: exact naturals and integers (an i128 fast path), exact dyadics, the exact-real sign, outward intervals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exact reals and outward intervals for CAM and copper-pour polygon operations.
real = []
# CAM's interval rules without the exact-zero rule (an exact zero operand rounded outward like any
# other): the rules as they were, kept one train for comparison. A build feature, never a runtime
# switch.
ival-strict = ["real"]

[dependencies]
forge-num-core = { path = "../forge-num-core" }

[lints]
workspace = true
