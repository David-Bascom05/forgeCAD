# kernel/forge-bool, boolean.rs's keep and apply steps (D7's and D8's code halves), translated for
# verify/forge-bool-proof. A second translation of forge-bool, in its own package: TRANSLATE's
# verify/aeneas/forge-bool (ssi.rs, D2) is the first; the two can merge into one package later.
SRC_CRATE=forge-bool
PKG=ForgeBoolApply
# The geometry is forge-geom's and forge-math's translations, Body's methods forge-topo-body's.
DEPS=(forge-math forge-geom forge-topo-body)
CHARON_ARGS=(
  --start-from forge_bool::boolean::keep_of
  --start-from forge_bool::boolean::apply
)
CHARON_ARGS+=(
  --opaque forge_geom::curve::ProcCurve
  --opaque forge_geom::surface::Proc
  --opaque forge_geom::intcurve::IntCurve
  --opaque forge_topo::body::FaceQuery
)
# The point-in-face query cache apply keeps up to date (not the topology D8 reads): opaque.
CHARON_ARGS+=(
  --opaque forge_bool::classify::drop_query_loops
  --opaque forge_bool::classify::extend_query
)
# Two blocks of apply Aeneas does not take, which keep their exact form in the shipped code (any
# helper there costs speed): translate.patch moves each, verbatim, into a function of its own for
# the translation only, opaque here and modelled in FunsExternal.lean (to prove):
# - staying_faces: which of A's faces stay (an iterator chain over zip and copied);
# - drop_replaced_loops: the loop dropping the loops locally split faces replace (a spec borrowed
#   across `&mut a` calls).
# - reversed (shipped as an #[inline(always)] helper, at no cost): a loop's uses reversed and
#   flipped (into_iter().rev().map().collect(), an in-place collect).
SRC_PATCH=translate.patch
CHARON_ARGS+=(--opaque forge_bool::boolean::staying_faces)
CHARON_ARGS+=(--opaque forge_bool::boolean::drop_replaced_loops)
CHARON_ARGS+=(--opaque forge_bool::boolean::reversed)
# std's `Map` impl overrides these `Iterator` methods; Aeneas's `Iterator` structure has only
# `next`, `step_by`, `enumerate`, `take` (the overrides are still translated and defined).
DROP_FIELDS=(map filter collect fold all any)
