name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: members
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      # The members sandbox only reaches the internet, so clone from the public door, not git.<domain>.
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "https://code.commonty.org/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (native)
        run: cargo test --workspace
      - name: test (wasm, same arithmetic as the browser)
        run: cargo test --workspace --target wasm32-wasip1
