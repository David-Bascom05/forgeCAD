# forgecad's generic machines: our own placeholder numbers in plausible ranges, not any maker's
# model. Geometry is in the base frame, every joint at 0 (the home pose), mm and degrees.
# Format: docs/cam-machine.md. Each body's real part is parts/<vendor>/<machine>/<body>.fg; its boxes and
# cylinders are the collision envelope (tests/parts.rs checks the part lies inside them).

# ---------------------------------------------------------------------------------------------
# A 3-axis VMC: Y saddle and X table carry the part, Z carries the head. Table top centre = origin.
[[machine]]
name = "generic-vmc3"
kind = "vmc3"
control = "fanuc"
length_joint = "Z"
coolants = ["flood", "mist", "air"]
clearance = 1.0
source = "forgecad generic VMC; placeholders, not a real machine"
taken = "2026-11-23"
note = "verify travel, rates and envelope against your machine's manual before trusting a collision verdict"

[[machine.joint]]
name = "Y"
parent = "base"
side = "table"
type = "linear"
axis = [0, -1, 0]       # the table moves -y for +Y: the tool moves +y relative to the part
range = [-200, 200]
rapid = 30000
max_feed = 10000
accel = 3000

[[machine.joint]]
name = "X"
parent = "Y"
side = "table"
type = "linear"
axis = [-1, 0, 0]
range = [-300, 300]
rapid = 30000
max_feed = 10000
accel = 3000

[[machine.joint]]
name = "Z"
parent = "base"
side = "head"
type = "linear"
axis = [0, 0, 1]
range = [-450, 0]
rapid = 24000
max_feed = 10000
accel = 3000

[[machine.spindle]]
name = "S1"
link = "Z"
kind = "milling"
axis = [0, 0, 1]
nose = [0, 0, 500]
rpm = [100, 12000]
curve_rpm = [0, 1500, 12000]
curve_kw = [0, 11, 11]
max = [250, 125]
interface = "BT40"

[[machine.changer]]
pockets = 24
change_s = 2.5
max_tool_kg = 8
position_joints = ["Z"]   # M6 sends Z to machine zero first (an assumption for this generic machine)
position = [0]

[[machine.mount]]
name = "spindle"
kind = "tool"
link = "Z"
at = [0, 0, 500]
dir = [0, 0, -1]

[[machine.mount]]
name = "table"
kind = "part"
link = "X"
at = [0, 0, 0]
dir = [0, 0, 1]
xdir = [1, 0, 0]

[[machine.body]]
name = "bed"
link = "base"
part = "parts/generic/generic-vmc3/bed.fg"
ignore = ["saddle", "column"]
[[machine.body.box]]
min = [-500, -450, -400]
max = [500, 450, -250]

[[machine.body]]
name = "column"
link = "base"
part = "parts/generic/generic-vmc3/column.fg"
ignore = ["bed", "head"]
[[machine.body.box]]
min = [-300, 450, -400]
max = [300, 750, 900]

[[machine.body]]
name = "saddle"
link = "Y"
part = "parts/generic/generic-vmc3/saddle.fg"
ignore = ["bed", "table"]
[[machine.body.box]]
min = [-350, -200, -250]
max = [350, 200, -150]

[[machine.body]]
name = "table"
link = "X"
part = "parts/generic/generic-vmc3/table.fg"
ignore = ["saddle"]
[[machine.body.box]]
min = [-400, -200, -150]
max = [400, 200, 0]

[[machine.body]]
name = "head"
link = "Z"
part = "parts/generic/generic-vmc3/head.fg"
ignore = ["column"]
[[machine.body.box]]
min = [-110, -110, 620]
max = [110, 450, 800]
[[machine.body.cyl]]
base = [0, 0, 500]
axis = [0, 0, 1]
r = 60
h = 120

# ---------------------------------------------------------------------------------------------
# A 5-axis trunnion (table-table): B tilts the cradle about y, C turns the rotary table on it;
# X Y Z carry the head. Rotary table top centre = origin; B's axis 50 mm below it.
[[machine]]
name = "generic-trunnion-bc"
kind = "table-table"
control = "fanuc"
length_joint = "Z"
coolants = ["flood", "mist", "through", "air"]
clearance = 1.0
source = "forgecad generic trunnion; placeholders, not a real machine"
taken = "2026-11-23"
note = "verify travel, rates and envelope against your machine's manual before trusting a collision verdict"

[[machine.joint]]
name = "X"
parent = "base"
side = "head"
type = "linear"
axis = [1, 0, 0]
range = [-400, 400]
rapid = 36000
max_feed = 12000
accel = 4000

[[machine.joint]]
name = "Y"
parent = "X"
side = "head"
type = "linear"
axis = [0, 1, 0]
range = [-300, 300]
rapid = 36000
max_feed = 12000
accel = 4000

[[machine.joint]]
name = "Z"
parent = "Y"
side = "head"
type = "linear"
axis = [0, 0, 1]
range = [-280, 0]       # the head's underside stays above the cradle and table at any tilt
rapid = 30000
max_feed = 12000
accel = 4000

[[machine.joint]]
name = "B"
parent = "base"
side = "table"
type = "rotary"
axis = [0, 1, 0]
pivot = [0, 0, -50]
range = [-120, 120]
rapid = 9000
max_feed = 5400
accel = 3600
preference = 1
tcp = true

[[machine.joint]]
name = "C"
parent = "B"
side = "table"
type = "rotary"
axis = [0, 0, 1]
pivot = [0, 0, 0]
range = [-360, 360]
rapid = 18000
max_feed = 10800
accel = 7200
cyclic = true
tcp = true

[[machine.spindle]]
name = "S1"
link = "Z"
kind = "milling"
axis = [0, 0, 1]
nose = [0, 0, 400]
rpm = [100, 18000]
curve_rpm = [0, 2000, 18000]
curve_kw = [0, 15, 15]
max = [220, 80]
interface = "HSK-A63"

[[machine.changer]]
pockets = 30
change_s = 3.0
max_tool_kg = 6
position_joints = ["Z"]   # M6 sends Z to machine zero first (an assumption for this generic machine)
position = [0]

[[machine.mount]]
name = "spindle"
kind = "tool"
link = "Z"
at = [0, 0, 400]
dir = [0, 0, -1]

[[machine.mount]]
name = "table"
kind = "part"
link = "C"
at = [0, 0, 0]
dir = [0, 0, 1]
xdir = [1, 0, 0]

[[machine.body]]
name = "bed"
link = "base"
part = "parts/generic/generic-trunnion-bc/bed.fg"
ignore = ["support-l", "support-r"]
[[machine.body.box]]
min = [-500, -450, -500]
max = [500, 450, -300]

[[machine.body]]
name = "support-l"
link = "base"
part = "parts/generic/generic-trunnion-bc/support-l.fg"
ignore = ["bed"]
[[machine.body.box]]
min = [-120, -330, -300]
max = [120, -250, 0]

[[machine.body]]
name = "support-r"
link = "base"
part = "parts/generic/generic-trunnion-bc/support-r.fg"
ignore = ["bed"]
[[machine.body.box]]
min = [-120, 250, -300]
max = [120, 330, 0]

[[machine.body]]
name = "cradle"
link = "B"
part = "parts/generic/generic-trunnion-bc/cradle.fg"
ignore = ["rotary"]
[[machine.body.box]]
min = [-160, -240, -150]
max = [160, 240, -40]

[[machine.body]]
name = "rotary"
link = "C"
part = "parts/generic/generic-trunnion-bc/rotary.fg"
ignore = ["cradle"]
[[machine.body.cyl]]
base = [0, 0, -40]
axis = [0, 0, 1]
r = 150
h = 40

[[machine.body]]
name = "head"
link = "Z"
part = "parts/generic/generic-trunnion-bc/head.fg"
[[machine.body.cyl]]
base = [0, 0, 400]
axis = [0, 0, 1]
r = 50
h = 100
[[machine.body.box]]
min = [-100, -100, 500]
max = [100, 100, 700]

# ---------------------------------------------------------------------------------------------
# A 2-axis lathe: Z along the spindle, X radial (programmed as a diameter). The turret rides
# X on Z. Origin = spindle centre at the chuck face; the part grows along +z.
[[machine]]
name = "generic-lathe"
kind = "lathe"
control = "fanuc-lathe"
coolants = ["flood"]
clearance = 1.0
source = "forgecad generic 2-axis lathe; placeholders, not a real machine"
taken = "2026-11-23"
note = "verify travel, rates and envelope against your machine's manual before trusting a collision verdict"

[[machine.joint]]
name = "Z"
parent = "base"
side = "head"
type = "linear"
axis = [0, 0, 1]
range = [-30, 400]      # the turret's underside stays above the headstock face
home = 400
rapid = 24000
max_feed = 5000
accel = 4000

[[machine.joint]]
name = "X"
parent = "Z"
side = "head"
type = "linear"
axis = [1, 0, 0]
range = [-10, 250]       # the joint's travel (radius); the program's X word is twice it
home = 250
rapid = 20000
max_feed = 5000
accel = 4000
diameter = true

[[machine.spindle]]
name = "main"
link = "base"
kind = "turning"
axis = [0, 0, 1]
nose = [0, 0, 0]
rpm = [50, 4500]
curve_rpm = [0, 800, 4500]
curve_kw = [0, 11, 11]
max = [300, 400]
interface = "A2-6"

[[machine.turret]]
name = "T1"
link = "X"
stations = 12
index_s = 0.3
center = [270, 0, 0]
index_axis = [0, 0, 1]

[[machine.mount]]
name = "turret"
kind = "tool"
link = "X"
at = [120, 0, 0]
dir = [-1, 0, 0]

[[machine.mount]]
name = "chuck"
kind = "part"
link = "base"
at = [0, 0, 0]
dir = [0, 0, 1]
xdir = [1, 0, 0]

[[machine.body]]
name = "headstock"
link = "base"
part = "parts/generic/generic-lathe/headstock.fg"
ignore = ["chuck"]
[[machine.body.box]]
min = [-200, -200, -400]
max = [200, 200, -80]

[[machine.body]]
name = "chuck"
link = "base"
part = "parts/generic/generic-lathe/chuck.fg"
ignore = ["headstock"]
[[machine.body.cyl]]
base = [0, 0, -80]
axis = [0, 0, 1]
r = 100
h = 80

[[machine.body]]
name = "turret"
link = "X"
part = "parts/generic/generic-lathe/turret.fg"
[[machine.body.cyl]]
base = [270, 0, -40]
axis = [0, 0, 1]
r = 150
h = 80

# ---------------------------------------------------------------------------------------------
# A mill-turn: main spindle (C) at the origin, a sub-spindle (Z2, C2) facing it, and a B-axis
# milling head on X Y Z. Z along the spindles, X radial (a diameter), Y across.
[[machine]]
name = "generic-mill-turn"
kind = "mill-turn"
control = "fanuc-lathe"
length_joint = "X"
coolants = ["flood", "through"]
clearance = 1.0
source = "forgecad generic mill-turn; placeholders, not a real machine"
taken = "2026-11-23"
note = "verify travel, rates and envelope against your machine's manual before trusting a collision verdict"

[[machine.joint]]
name = "C"
parent = "base"
side = "table"
type = "rotary"
axis = [0, 0, 1]
pivot = [0, 0, 0]
range = [-360, 360]
rapid = 36000
max_feed = 7200
cyclic = true

[[machine.joint]]
name = "Z2"
parent = "base"
side = "table"
type = "linear"
axis = [0, 0, -1]
range = [0, 500]
rapid = 20000
max_feed = 5000
accel = 3000

[[machine.joint]]
name = "C2"
parent = "Z2"
side = "table"
type = "rotary"
axis = [0, 0, -1]
pivot = [0, 0, 0]
range = [-360, 360]
rapid = 36000
max_feed = 7200
cyclic = true

[[machine.joint]]
name = "Z"
parent = "base"
side = "head"
type = "linear"
axis = [0, 0, 1]
range = [-100, 600]
home = 600
rapid = 30000
max_feed = 8000
accel = 4000

[[machine.joint]]
name = "X"
parent = "Z"
side = "head"
type = "linear"
axis = [1, 0, 0]
range = [-50, 300]
home = 300
rapid = 30000
max_feed = 8000
accel = 4000
diameter = true

[[machine.joint]]
name = "Y"
parent = "X"
side = "head"
type = "linear"
axis = [0, 1, 0]
range = [-100, 100]
rapid = 20000
max_feed = 6000
accel = 3000

[[machine.joint]]
name = "B"
parent = "Y"
side = "head"
type = "rotary"
axis = [0, 1, 0]
pivot = [250, 0, 0]
range = [-30, 210]
rapid = 18000
max_feed = 7200
accel = 3600

# Zones the control forbids (stored stroke checks), so the B head cannot reach the headstock,
# the chuck or the sub-spindle. The head reaches 175 mm from its B pivot (X + 250, Z); each
# zone keeps it 1 mm clear for every B. The sub-spindle's (Z + Z2 > 724, X < 106) is a staircase
# of overlapping 50 mm bins in Z.
[[machine.zone]]
name = "headstock"
joints = ["X", "Z"]
min = [-51, -101]
max = [146, 86]

[[machine.zone]]
name = "chuck"
joints = ["X", "Z"]
min = [-51, -101]
max = [31, 176]

[[machine.zone]]
