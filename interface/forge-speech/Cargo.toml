[package]
name = "forge-speech"
description = "Speech to text for ForgeCAD's Agent tab: a process of its own, holding the model and the microphone"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.commonty.org/david/ForgeCAD"

# its own workspace (the root excludes it): the one crate that calls C, at run time (dlopen)
[workspace]

[dependencies]
forge-dirs = { path = "../../kernel/forge-dirs" }

[[bin]]
name = "forge-speech"
path = "src/main.rs"

[profile.dev.package."*"]
opt-level = 2

# the microphone where ALSA isn't: CoreAudio on macOS, WASAPI on Windows
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = "=0.18.2"
