[target.wasm32-wasip1]
runner = "tools/wasi-run.mjs"

# AVX2-era x86 (2013+): floor and round are single instructions, wider SIMD. Results are bit for
# bit the same as the baseline target (examples/bits); FMA stays off, since nothing calls mul_add
# and Rust never fuses on its own.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]
