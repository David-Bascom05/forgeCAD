[package]
name = "forge-bool"
description = "Boolean operations (union, subtract, intersect) on ForgeCAD solids"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-math = { path = "../forge-math" }
forge-geom = { path = "../forge-geom" }
forge-topo = { path = "../forge-topo" }
forge-bool-core = { path = "../forge-bool-core", optional = true }

[features]
# the decision log (src/decisions.rs): every near-tolerance decision recorded under its entities,
# contradictions within one boolean counted, and the retry ladder's rungs; off, nothing is compiled
decisions = ["forge-geom/decisions", "forge-topo/decisions"]
# the certificate for the proven checker (src/certify.rs, verify/forge-certify); off, nothing is compiled
certify = []
# the decide-once flat-face boolean (src/decide_once.rs over forge-bool-core): flat booleans go
# through the ledger and the combinatorial core; off by default, the old path unchanged
decide_once = ["dep:forge-bool-core"]
# the local-imprint column path (src/imprint.rs) chosen at run time by FORGE_IMPRINT or
# imprint::set_mode (off, on, check against the general boolean): a research and test switch, off in
# every shipped build, where the boolean reads no environment (old-path-statements.md §G, G8).
# `cargo test -p forge-model --test imprint --features imprint_column` is the column's check
imprint_column = []

[dev-dependencies]
forge-ops = { path = "../forge-ops" }
forge-mesh = { path = "../forge-mesh" }

[lints]
workspace = true
