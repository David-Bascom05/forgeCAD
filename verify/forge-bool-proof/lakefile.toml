name = "forgeboolproof"
version = "0.1.0"
defaultTargets = ["ForgeBoolProof"]
# Mathlib, Aeneas's library and forge-exact shared with verify/forge-curved's checkout (same pins).
packagesDir = "../forge-curved/.lake/packages"

[leanOptions]
relaxedAutoImplicit = false
