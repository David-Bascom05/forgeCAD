name = "forgeexact"
version = "0.1.0"
defaultTargets = ["ForgeExact", "forge-exact", "curved-guards"]

[leanOptions]
relaxedAutoImplicit = false
autoImplicit = false

# The spec and its proofs, and the executable reference they are proven about: core Lean only
# (no Mathlib, whose prebuilt cache this repository's machines cannot fetch), so one build checks
# both and the compiled reference links nothing else.
[[lean_lib]]
name = "ForgeExact"

# The reference's driver (ForgeExact/Ref/Input.lean gives its format).
[[lean_exe]]
name = "forge-exact"
root = "Main"

# Non-vacuity of `curved_exact`: the representative curved inputs are certified (compiled; the
# interpreted #guard of all five takes minutes).
[[lean_exe]]
name = "curved-guards"
root = "CurvedGuards"
