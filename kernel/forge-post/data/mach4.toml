# Mach4 Mill: restated from the "Mach4 Mill G-code Programming Guide" v1.1 build 3775
# (machsupport.com); every code is cited below. The guide does not state the comment syntax, so the
# post writes no comments.
[dialect]
name = "mach4"
extension = "tap"
decimals = 4
feed_decimals = 1
point = "always"
program_open = []
program_close = ["M30", "%"]
line_numbers = false
safe_start = ["G00 G90 G17 G40 G49 G80", "G21 G94", "G91.1"]
tool_change = ["T{t} M06"]
length_comp = "G43 H{h}"
spindle_cw = "S{rpm} M03"
spindle_ccw = "S{rpm} M04"
spindle_stop = "M05"
wcs = "G{n}"
wcs_first = 54
wcs_count = 6
arc = "ijk"
retract_home = ["G53 G00 Z0"]
coolant_flood = "M08"
coolant_mist = "M07"
coolant_off = "M09"
dwell = "G04 P{ms}"
cycle_drill = "G98 G81 X{x} Y{y} Z{z} R{r} F{f}"
cycle_dwell = "expand"
cycle_peck = "expand"
cycle_chipbreak = "expand"
cycle_tap = "G98 G84 X{x} Y{y} Z{z} R{r} F{f}"
cycle_ream = "G98 G85 X{x} Y{y} Z{z} R{r} F{f}"
cycle_next = "X{x} Y{y}"
cycle_cancel = "G80"
read_g_ignore = [91.1]
source = "Mach4 Mill G-code Programming Guide v1.1 (cited per code)"
taken = "2026-11-23"
note = "comments are not written (the guide gives no comment syntax); a trailing % guarantees the last end-of-block"
cite_required = true

[[dialect.cite]]
key = "program_open"
source = "https://www.machsupport.com/wp-content/uploads/2014/05/Mill%20GCode%20Programming.pdf"
taken = "2026-11-23"
where = "Mach4 CNC Controller Mill Programming Guide (Newfangled Solutions / Artsoft USA), Version 1.1, Build 3775 (c) 2014; Ch.1 Format p9-10"
note = "no start code required: none written"

[[dialect.cite]]
key = "program_close"
source = "https://www.machsupport.com/wp-content/uploads/2014/05/Mill%20GCode%20Programming.pdf"
taken = "2026-11-23"
where = "Mach4 CNC Controller Mill Programming Guide (Newfangled Solutions / Artsoft USA), Version 1.1, Build 3775 (c) 2014; Ch.1 Format p9-10; Ch.5 M02 p82, M30 p84"
note = "M30, then % so the last block has its EOB"

