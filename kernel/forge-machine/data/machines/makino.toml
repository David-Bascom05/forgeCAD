# Makino a51nx: nx-series HMC (400 mm pallet), Makino Professional 6 (Pro6).
# X 560 Y 640 Z 640; 14000 rpm CAT40 (US) / BT40 (JP, EU); HSK-A63 option; 60 tools.
[[machine]]
name = "makino-a51nx"
kind = "vmc4"
control = "fanuc"
length_joint = "Z"
coolants = ["flood"]
clearance = 1
source = "https://www.makino.com/en-us/machine-technology/machines/horizontal-4-axis/a51nx | https://www.makino.eu/en-us/machine-technology/machines/horizontal-4-axis/a51nx | https://www.makino.co.jp/ja-jp/machine-technology/machines/horizontal-4-axis/a51nx"
taken = "2026-11-23"
note = "pallets: count UNKNOWN, 400 square, change time UNKNOWN, load 400 kg; the APC is not in the format (FORMAT-GAPS B1): the pallet at the spindle is the part mount, kind vmc4; spindle nose to pallet centre UNKNOWN: 100 to 100 + Z (estimate); Z modelled on the head (X column, Y head, Z ram) because the format needs the length joint on the head side (FORMAT-GAPS B10); the tool-to-part motion is the same either way; spindle centre above the pallet UNKNOWN: 100 to 100 + Y (estimate); spindle power as published: torque max 303 N.m (no curve: no power check); max tool diameter 70 with the neighbouring pockets full, 170 with them empty; magazine options: 134/219/311 (US page), 133/218/313 (JP page), 40 (US page); an unpublished required field takes the value that makes its check vacuous (rapid high, max feed = rapid, change time 0.001 s, tool weight 99 kg), named UNKNOWN beside it; joint 0 = mid X, Y 0 = spindle lowest (home at the top), Z 0 = spindle farthest from the pallet; machine zero UNKNOWN; bodies are single boxes/cylinders from published overall sizes; head, column, saddle, bed and turret sizes are estimates, the spindle housing radius kept large; the enclosure is not modelled."
real = true

[[machine.joint]]
name = "X"
parent = "base"
side = "head"
type = "linear"
axis = [1, 0, 0]
range = [-280, 280]
rapid = 60000
max_feed = 50000

[[machine.joint]]
name = "Y"
parent = "X"
side = "head"
type = "linear"
axis = [0, 1, 0]
range = [0, 640]
home = 640
rapid = 60000
max_feed = 50000

[[machine.joint]]
