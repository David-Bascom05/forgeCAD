[package]
name = "forge-lang"
description = "Forge (.fg): a typed, parametric part language for agents, evaluated straight to forge-model features"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fg"
path = "src/bin/fg.rs"

[dependencies]
forge-math = { path = "../../kernel/forge-math" }
forge-geom = { path = "../../kernel/forge-geom" }
forge-topo = { path = "../../kernel/forge-topo" }
forge-ops = { path = "../../kernel/forge-ops" }
forge-mesh = { path = "../../kernel/forge-mesh" }
forge-model = { path = "../../kernel/forge-model" }
forge-sketch = { path = "../../kernel/forge-sketch" }
forge-sheet = { path = "../../kernel/forge-sheet" }
forge-thermo = { path = "../../kernel/forge-thermo" }
forge-material = { path = "../../kernel/forge-material" }
forge-agent = { path = "../forge-agent" }
forge-font = { path = "../../kernel/forge-font" }
forge-step = { path = "../../kernel/forge-step" }
forge-doc = { path = "../forge-doc" }
forge-asm = { path = "../../kernel/forge-asm" }
forge-draw = { path = "../../kernel/forge-draw" }

[dev-dependencies]
forge-bool = { path = "../../kernel/forge-bool" }

[lints]
workspace = true
