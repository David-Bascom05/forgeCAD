# Decide-once for curved inputs over ℝ (verify/forge-curved, design D1): the Mathlib proofs about
# forge-exact's curved definitions (faithful cells, `xNonManifold_iff_top`, the tangent-cylinder
# test, and `end_to_end_curved` through the aeneas project's proven `CoreSpec`). One `lake build` on the pinned toolchain, with Mathlib's
# prebuilt cache; then the axiom report: every `#print axioms` line of ForgeCurved/Axioms.lean
# must show only propext, Classical.choice and Quot.sound (no sorryAx).
# Lake's build directories (this project's, forge-exact's, forge-bool-core's and Aeneas's library)
# are restored from main's latest; Lake rebuilds every module whose sources differ. Main's runs
# save them (tools/ci/lake-cache.py). Mathlib comes from its own server (`lake exe cache get`).
name: forge-curved

on:
  push:
    branches: [main]
    paths: ["verify/forge-curved/**", "verify/forge-exact/**", "verify/aeneas/forge-bool-core/lean/**", ".github/workflows/forge-curved.yml"]
  pull_request:
    paths: ["verify/forge-curved/**", "verify/forge-exact/**", "verify/aeneas/forge-bool-core/lean/**", ".github/workflows/forge-curved.yml"]
  workflow_dispatch:

# A new push to a pull request cancels that pull request's runs still queued or running for its
# older commits; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: elan and the pinned toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat verify/forge-curved/lean-toolchain)"
      - name: Lake cache key
        id: lake
        run: python3 tools/ci/lake-cache.py forge-curved verify/forge-curved
      - name: Lake build (restored; Lake rebuilds what changed)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.lake.outputs.paths }}
          key: ${{ steps.lake.outputs.key }}
          restore-keys: |
            ${{ steps.lake.outputs.prefix }}
            ${{ steps.lake.outputs.any }}
      - name: the proofs
        if: ${{ github.event_name != 'push' || steps.restore.outputs.cache-hit != 'true' }}
        working-directory: verify/forge-curved
        run: |
          lake exe cache get
          lake build 2>&1 | tee build.log
          if [ "$GITHUB_EVENT_NAME" = push ]; then exit 0; fi  # main: the build above is what is saved; the checks below ran on the pull request
          grep -q "Build completed successfully" build.log
      - name: the axiom report
        if: ${{ github.event_name != 'push' }}
        working-directory: verify/forge-curved
        run: |
          lake env lean ForgeCurved/Axioms.lean 2>&1 | tee axioms.log
          if grep -q "sorryAx\|declaration uses [\`']sorry" build.log axioms.log; then echo "::error::sorry"; exit 1; fi
          bad=$(grep "depends on axioms" axioms.log | grep -v -E "\[(propext(, Classical\.choice)?(, Quot\.sound)?|propext, Quot\.sound|)\]" || true)
          if [ -n "$bad" ]; then echo "::error::non-standard axioms:"; echo "$bad"; exit 1; fi
          grep -q "'ForgeCurved.xNonManifold_iff_top' depends on axioms" axioms.log \
            || { echo "::error::xNonManifold_iff_top missing from the axiom report"; exit 1; }
      - name: save the Lake build (main only, even when a check failed)
        if: ${{ always() && steps.lake.outcome == 'success' && steps.restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.lake.outputs.paths }}
          key: ${{ steps.lake.outputs.key }}
