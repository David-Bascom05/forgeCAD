name = "forgesheetcore"
version = "0.1.0"
defaultTargets = ["ForgeSheetCore"]

# The float bridge (Aeneas's library, verify/ieee754, f64 as binary64); this crate has no floats,
# but the translation imports it as every crate's does.
[[require]]
name = "aeneasf64"
path = "../../bridge"

# The spec the translation is proven against: verify/sheet (Classes.lean, Region.lean).
[[require]]
name = "sheet"
path = "../../../sheet"

[[lean_lib]]
name = "ForgeSheetCore"

# forge-math's translation (the aeneas session's, verify/aeneas/forge-math): the zone fold's
# Frame::point_to_world is proven against it, not a copy.
[[require]]
name = "forgemath"
path = "../../forge-math/lean"
