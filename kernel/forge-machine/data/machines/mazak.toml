note = "A's sign: Mazak publishes -120..+30; the direction of +A (which way the table tilts) is UNKNOWN; modelled right-handed about +X; A's pivot below the table top UNKNOWN: 150 mm (estimate); C range and A/C speeds UNKNOWN; architecture of X/Y/Z UNKNOWN (Mazak does not say which unit carries which); the tool-to-part motion is the same either way; the spec page says CAT40 18,000 rpm 30 kW (40% ED) / 26 kW cont, 120 N.m max; the product summary says BT40 12,000 rpm: the spec page is used; spindle power as ratings only: no curve, no power check; tool change time UNKNOWN; 2-pallet changer optional; C's speed and turning: none (milling only); an unpublished required field takes the value that makes its check vacuous (rapid high, max feed = rapid, change time 0.001 s, tool weight 99 kg), named UNKNOWN beside it; overall 2235.2 x 4445 x 3225.8, 13000 kg; joint 0 = mid-travel for X and Y and the top of travel for Z; the control's machine zero is at a travel end (which: UNKNOWN), so a real G54 differs by a constant per axis; bodies are single boxes/cylinders from published overall sizes; head, column, saddle, bed and turret sizes are estimates, the spindle housing radius kept large; the enclosure is not modelled; mazak-eia is not in forge-post yet."
