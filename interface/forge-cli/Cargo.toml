[package]
name = "forge-cli"
description = "Command-line driver for the ForgeCAD kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "forgecad"
path = "src/main.rs"

[dependencies]
forge-dirs = { path = "../../kernel/forge-dirs" }
forge-workholding = { path = "../../kernel/forge-workholding" }
forge-math = { path = "../../kernel/forge-math" }
forge-geom = { path = "../../kernel/forge-geom" }
forge-topo = { path = "../../kernel/forge-topo" }
forge-ops = { path = "../../kernel/forge-ops" }
forge-mesh = { path = "../../kernel/forge-mesh" }
forge-model = { path = "../../kernel/forge-model" }
forge-agent = { path = "../forge-agent" }
forge-import = { path = "../forge-import" }
forge-lang = { path = "../forge-lang" }
forge-cam-lang = { path = "../forge-cam-lang" }
forge-machine-lang = { path = "../forge-machine-lang" }
forge-turn-lang = { path = "../forge-turn-lang" }
forge-step = { path = "../../kernel/forge-step" }

[dev-dependencies]
forge-material = { path = "../../kernel/forge-material" }

[lints]
workspace = true
