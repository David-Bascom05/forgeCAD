name = "forgecurved"
version = "0.1.0"
defaultTargets = ["ForgeCurved"]

[leanOptions]
relaxedAutoImplicit = false
autoImplicit = false

# Decide-once for curved inputs over ℝ (research/decide-once/curved-design.md, decision D1): the
# faithfulness of the curved cells (R1–R4), Lemma D and `xNonManifold_iff_top`, proven with Mathlib
# about the definitions of verify/forge-exact (core Lean), which this package requires by path.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[require]]
name = "forgeexact"
path = "../forge-exact"

[[lean_lib]]
name = "ForgeCurved"

# The shipped Rust core's refinement proof (Aeneas), for `EndToEndCurved`: `CoreSpec` (proven
# there) followed by the curved correctness of this package, as `end_to_end_of` does for flat.
[[require]]
name = "forgeboolcore"
path = "../aeneas/forge-bool-core/lean"
