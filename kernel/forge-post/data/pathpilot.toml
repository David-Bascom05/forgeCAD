# Tormach PathPilot (mill): restated from Tormach's openly published G-code and machine-code pages
# (tormach.com) and the PathPilot post processor guidelines (knowledgebase.tormach.com); every code
# is cited below. Values were read through a page summariser: verify against the pages.
[dialect]
name = "pathpilot"
extension = "nc"
decimals = 4
feed_decimals = 1
point = "always"
program_open = ["({title})"]
program_close = ["M30"]
comment = "({text})"
comment_strip = "()"
line_numbers = false
safe_start = ["G17 G21 G40 G49 G80 G90 G94"]
tool_change = ["T{t} M06 G43 H{h}"]
spindle_cw = "S{rpm} M03"
spindle_ccw = "S{rpm} M04"
spindle_stop = "M05"
wcs = "G{n}"
wcs_first = 54
wcs_count = 6
arc = "ijk"
coolant_flood = "M08"
coolant_mist = "M07"
coolant_off = "M09"
dwell = "G04 P{s}"
cycle_drill = "G98 G81 X{x} Y{y} Z{z} R{r} F{f}"
cycle_dwell = "G98 G82 X{x} Y{y} Z{z} R{r} P{s} F{f}"
cycle_peck = "expand"
cycle_chipbreak = "expand"
cycle_tap = "refuse"
cycle_ream = "G98 G85 X{x} Y{y} Z{z} R{r} F{f}"
cycle_next = "X{x} Y{y}"
cycle_cancel = "G80"
source = "Tormach PathPilot G-code reference pages and post guidelines (cited per code)"
taken = "2026-11-23"
note = "no % marks (the guidelines say so); G43 H on the tool-change line; arcs in the default incremental centre mode (G91.1)"
cite_required = true

