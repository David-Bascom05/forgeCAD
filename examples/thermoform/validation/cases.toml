# Validation cases: each model here against a measured (or exact) file. `data` is a file name in the validation
# data folder (~/projects/forgecad-gate/thermo-fea/validation, or THERMO_VALIDATION_DATA), or repo:PATH in this repo.
# mode: arc (arc length from the centre along the cut), arc_edge (from the clamp edge), radial (horizontal distance
# from the axis), index (point index mapped to arc length by index_map pairs), mean (the part's mean wall / t0),
# bubble (pole height vs pressure), ref_inflation (H, t_pole vs P, exact), corner (fillet radius and wall, exact).
# cut_deg: the cut's direction in the trim plane from x (0 = a grid row from the centre node, 45 = its diagonal).
# filter: column=value selects rows. fold / fold_about: the data's s runs across the part and is folded.
# The scoreboard harness: interface/forge-lang/tests/thermo_validation.rs.

[[case]]
id = "duarte2022_cone"
cause = "none dominant (uniform T, deep cone: sticking holds)"
model = "duarte2022_cone.fg"
data = "repo:kernel/forge-thermo/data/benchmarks/duarte2022_cone.csv"
mode = "arc"
s_col = "s_mm"
t_col = "t_mm"
t0 = 1.0
cut_deg = 0
axisym = true
how = "arc length from the bottom centre along a radial cut (grid row through the centre)"

