name = "aeneasf64"
version = "0.1.0"
defaultTargets = ["AeneasF64"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Aeneas's Lean library at the commit tools/aeneas/setup.sh pins (its Mathlib is v4.36.0, the
# same as verify/ieee754's).
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "2e3d4488280bb8a95411db81019a7854a784861f"
subDir = "backends/lean"

[[require]]
name = "ieee754"
path = "../../ieee754"

[[lean_lib]]
name = "AeneasF64"
