# kernel/forge-weld: a section's measures (L4 for research/weld-lean)
PKG=ForgeWeldRs
CHARON_ARGS=(
  --start-from forge_weld::section::top
  --start-from forge_weld::section::line_moments
  --start-from forge_weld::section::support_loop
)
# Translated from their crates too: the vectors, and a piece's ends.
CHARON_ARGS+=(
  --include forge_math::vec::_
  --include forge_ops::profile::_::start
  --include forge_ops::profile::_::end
)
# Opaque: the arcs' angle tests and the library calls under them (each piece is a line in what is
# proven; an arc's step is the arc branch, left opaque):
CHARON_ARGS+=(
  --opaque forge_math::dmath
  --opaque forge_weld::section::on_arc
  --opaque forge_ops::spline
)
