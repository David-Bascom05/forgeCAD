[workspace]
resolver = "3"
members = ["kernel/*", "interface/*", "verify/feeds-vs-makers", "verify/fillet-oracle", "verify/forge-bench", "verify/forge-cam-quality", "verify/forge-certify", "verify/forge-coverage", "verify/forge-mass", "verify/forge-mesh-check", "verify/forge-proof", "verify/forge-read-fuzz", "verify/forge-refold", "verify/forge-sketch-check", "verify/forge-topo-check", "verify/forge-transform", "verify/forge-exact/fuzz"]
# its own workspace, so wgpu never enters a kernel build or this Cargo.lock
# verify/ holds Lean packages beside the Rust crates: the Rust ones are named above, so a new Lean
# package needs no entry here (a new Rust crate under verify/ is added to members)
exclude = ["interface/forge-render", "interface/forge-speech"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.commonty.org/david/ForgeCAD"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_cmp = "allow"
many_single_char_names = "allow"

# What ships, and what the speed gate measures: one codegen unit. 3-5% quicker on the CAM documents
# and most bench parts than 16 (mold_core_cam 12.5 s -> 11.9 s), and a function's code no longer
# moves when an unrelated item is added elsewhere in its crate (the gate's counts then move only
# with code that changed). About 20% longer to build; fat LTO measured too: fewer instructions, no
# quicker, 66% longer to build (research in FALLBACK's report, 2026-11-24). CI's test builds set
# CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 for speed; the fuzz profile keeps 16 too.
[profile.release]
codegen-units = 1

[profile.test]
opt-level = 1

[profile.test.package.forge-math]
opt-level = 3
[profile.test.package.forge-geom]
opt-level = 3
[profile.test.package.forge-topo]
opt-level = 3
[profile.test.package.forge-bool]
opt-level = 3
[profile.test.package.forge-mesh]
opt-level = 3
[profile.test.package.forge-step]
opt-level = 3
[profile.test.package.forge-ops]
opt-level = 3
[profile.test.package.forge-model]
opt-level = 3
[profile.test.package.forge-sketch]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# verify/forge-read-fuzz: release speed, with the checks a test build has (an overflow is a finding)
[profile.fuzz]
inherits = "release"
codegen-units = 16
overflow-checks = true
debug-assertions = true

# the browser build: cargo build --profile wasm --target wasm32-wasip1
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
