# The mesh files' Lean claims (verify/forge-mesh-files/lean): binary STL, OBJ and the 3MF model
# part read back as written. `lake build` on the pinned toolchain (core Lean only, no Mathlib),
# then the axiom check: a `sorry`, `native_decide` or any axiom past propext, Classical.choice
# and Quot.sound fails the job. Lake's build directory is restored from main's latest (Lake
# rebuilds every module whose sources differ); main's runs save it (tools/ci/lake-cache.py).
name: lean-mesh-files

on:
  push:
    branches: [main]
    paths: ["verify/forge-mesh-files/**", "kernel/forge-mesh/src/**",
            ".github/workflows/lean-mesh-files.yml"]
  pull_request:
    paths: ["verify/forge-mesh-files/**", "kernel/forge-mesh/src/**",
            ".github/workflows/lean-mesh-files.yml"]
  workflow_dispatch:

# A new push to a pull request cancels that pull request's runs still queued or running for its
# older commits; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verify/forge-mesh-files/lean
    steps:
      - uses: actions/checkout@v4
      - name: elan and the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Lake cache key
        id: lake
        working-directory: .
        run: python3 tools/ci/lake-cache.py lean-mesh-files verify/forge-mesh-files/lean
      - name: Lake build (restored; Lake rebuilds what changed)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.lake.outputs.paths }}
          key: ${{ steps.lake.outputs.key }}
          restore-keys: |
            ${{ steps.lake.outputs.prefix }}
            ${{ steps.lake.outputs.any }}
      - name: build and axioms
        if: ${{ github.event_name != 'push' || steps.restore.outputs.cache-hit != 'true' }}
        run: |
          set -o pipefail
          lake build
          if [ "$GITHUB_EVENT_NAME" = push ]; then exit 0; fi  # main: the build above is what is saved; the checks below ran on the pull request
          lake env lean Axioms.lean | tee axioms.txt
          ! grep -E "sorryAx|ofReduceBool" axioms.txt
      - name: save the Lake build (main only, even when a check failed)
        if: ${{ always() && steps.lake.outcome == 'success' && steps.restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.lake.outputs.paths }}
          key: ${{ steps.lake.outputs.key }}
