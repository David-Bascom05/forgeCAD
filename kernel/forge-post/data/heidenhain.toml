# HEIDENHAIN TNC 640 ISO programming (.I files), milling: restated from HEIDENHAIN's openly
# published "TNC 640 User's Manual ISO Programming" 10/2023 (ID 892909) and "Programming of Machining
# Cycles" 10/2022 (ID 1303406); every code is cited below. Klartext (.H, conversational) is NOT G-code
# and is not written here. HEIDENHAIN's G numbers mean other things than Fanuc's (G28 mirroring,
# G80 working plane, G98 label, G99 tool definition): only the codes below are written.
[dialect]
name = "heidenhain"
extension = "i"
decimals = 3
feed_decimals = 0
units_mm = "G71"
point = "never"
sign = "always"
g_digits = 2
program_open = ["%P{num} {units} *"]
program_close = ["M30", "N99999999 %P{num} {units} *"]
comment = ";{text}"
comment_eol = ";"
comment_strip = ";*"
block_end = "*"
line_numbers = true
line_numbers_required = true
line_start = 10
line_step = 10
safe_start = ["G40 G90"]
tool_change = ["T{t} G17"]
tool_word = true
spindle_cw = ["T G17 S{rpm}", "M3"]
spindle_ccw = ["T G17 S{rpm}", "M4"]
spindle_stop = "M5"
wcs = ""
wcs_first = 0
wcs_count = 1
arc = "centre_abs"
coolant_flood = "M8"
coolant_off = "M9"
dwell = "G04 F{s}"
cycle_drill = "expand"
cycle_dwell = "expand"
cycle_peck = "expand"
cycle_chipbreak = "expand"
cycle_tap = "refuse"
cycle_ream = "expand"
read_g_ignore = [71]
cite_required = true
source = "HEIDENHAIN TNC 640 ISO Programming 10/2023 (892909); Machining Cycles 10/2022 (1303406) (cited per code)"
taken = "2026-11-23"
note = "drilling cycles are posted as moves (HEIDENHAIN's G200-G207 take Q parameters and an M99 call, not modelled); rigid tapping (G207) and a machine-home retract (M91 needs machine coordinates) are refused"

[[dialect.cite]]
key = "program_open"
source = "https://content.heidenhain.de/doku/tnc_guide/pdf_files/TNC640/34059x-18/diniso/892909-2C.pdf"
taken = "2026-11-23"
where = "3.5 p. 93; example p. 63"
note = "%NAME G71 * opens an ISO program in mm (the name: P and the program number)"

[[dialect.cite]]
key = "program_close"
source = "https://content.heidenhain.de/doku/tnc_guide/pdf_files/TNC640/34059x-18/diniso/892909-2C.pdf"
taken = "2026-11-23"
where = "3.5 p. 93; example p. 63; M table 7.2 p. 229"
note = "M30 ends the program; the last block is N99999999 %NAME G71 *"

[[dialect.cite]]
key = "comment"
source = "https://content.heidenhain.de/doku/tnc_guide/pdf_files/TNC640/34059x-18/diniso/892909-2C.pdf"
taken = "2026-11-23"
where = "6.3 pp. 196-197; example p. 335 (N40 ;)"
note = ";  starts a comment to the end of the block; a comment block carries no * "

[[dialect.cite]]
