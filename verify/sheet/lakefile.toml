name = "sheet"
version = "0.1.0"
defaultTargets = ["Sheet"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib at the tag the toolchain matches: the pin verify/ieee754 and verify/krawczyk use.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "Sheet"

# The differential oracle of kernel/forge-sheet/tests/lean_diff.rs.
[[lean_exe]]
name = "sheet-oracle"
root = "OracleMain"
