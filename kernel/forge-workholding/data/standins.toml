max_width = 50

[[workholding]]
name = "standin-soft-al-150"
kind = "soft_jaws"
standin = true
basis = "a stand-in soft-jaw blank for the 6 in vise class: width and height match standin-vise-150; thickness ours"
note = "the blank's material is aluminium 6061; verify with the vendor before ordering"
width = 150
height = 50
thickness = 38

