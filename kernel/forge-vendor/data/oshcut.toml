# OSH Cut, restated from its public material and design pages (read 2026-11-22). Not an official
# profile and not endorsed by OSH Cut. Verify with the vendor before ordering.
# PARTIAL: OSH Cut publishes bend radii, K and minimum flange only in its web app's catalog, which
# could not be read; this profile has no bend data, so a bent sheet must give r: and bend: itself.
# Sources and choices: research/sheet-metal/vendors/oshcut.md
format = 1
id = "oshcut"
name = "OSH Cut"
source = "https://www.oshcut.com/materialdetails/aluminum-5052-h32 ; /aluminum-6061-t6 ; /steel-a1008-cr ; /stainless-steel-304-2b-finish ; https://www.oshcut.com/capabilities"
taken = "2026-11-22"
units = "in"
note = "Partial: cut rules per stock (minimum hole, channel, wall, part size) from OSH Cut's material pages; no bend radii or K (in its app catalog only). Not official. Verify with the vendor before ordering."
operations = ["laser", "bend", "tap", "countersink", "hardware", "powder_coat", "deburr"]
kerf = 0.006

[limits]
max_flat = [59, 119]
min_flat = [0.1, 0.1]

[tolerance]
cut = "+/-0.005 in for most materials and thicknesses"
bend_angle = "+/-1.0 deg"

