# kernel/forge-mesh: the constrained Delaunay triangulator (cdt.rs), level L4
PKG=ForgeMesh
CHARON_ARGS=(
  --start-from forge_mesh::cdt
)
# Opaque: the one shell that names a dyn Refine (a None of it), so not the core's business
CHARON_ARGS+=(
  --opaque forge_mesh::cdt::triangulate
)
# Of forge-math, translated here with the CDT: Point2's and Vec2's arithmetic, the BRIO shuffle's
# Rng, and certainly_in_circle (the filter the Lawson flips use). orient2d stays opaque, and
# lean/ForgeMesh/FunsExternal.lean defines it as verify/aeneas/forge-math's proven translation.
# forge_geom's work budget (a thread-local counter) is the shell's: opaque, defined there as
# Lean opaque constants, so a proof holds whatever it answers.
CHARON_ARGS+=(
  --include forge_math::vec::_
  --include forge_math::rng::_
  --include forge_math::predicates::certainly_in_circle
  --include forge_math::predicates::ICC_BOUND
  --include forge_math::predicates::EPS
)
